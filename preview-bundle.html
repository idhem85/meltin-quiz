<!-- Design system (variables thémables + composants) -->
<style>
/* ════════════════════════════════════════════════════════════════
   MELTIN QUIZ — Design System
   Les variables --* sont surchargées à l'exécution par le thème
   (voir js/core/theme.js et le dashboard #/admin).
════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0b1226;
  --bg-2: #101a33;
  --bg-3: #1b2540;
  --accent: #22d3ee;
  --accent-2: #a78bfa;
  --accent-3: #34d399;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --radius: 1.25rem;
  --font-display: 'Poppins', sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 800px at 80% -10%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  overscroll-behavior-y: none;
}
.font-display { font-family: var(--font-display); }

/* Décor : halos flous animés */
.blob { position: fixed; border-radius: 9999px; filter: blur(90px); opacity: .30; pointer-events: none; z-index: 0; animation: floatBlob 16s ease-in-out infinite; }
.blob-cyan    { background: var(--accent);   top: -6rem;   left: -6rem;  width: 30rem; height: 30rem; }
.blob-violet  { background: var(--accent-2); bottom: -8rem; right: -6rem; width: 34rem; height: 34rem; animation-delay: -6s; }
.blob-emerald { background: var(--accent-3); bottom: 22%;   left: 32%;    width: 20rem; height: 20rem; opacity: .16; animation-delay: -11s; }
@keyframes floatBlob {
  0%,100% { transform: translate(0,0) scale(1); }
  33%     { transform: translate(46px,-38px) scale(1.14); }
  66%     { transform: translate(-34px,30px) scale(0.92); }
}
.grid-bg {
  position: fixed; inset: 0; pointer-events: none; opacity: .05; z-index: 0;
  background-image: linear-gradient(rgba(148,163,184,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.35) 1px, transparent 1px);
  background-size: 56px 56px;
}

/* Glassmorphism */
.glass {
  background: color-mix(in srgb, var(--bg-2) 55%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(2,6,23,.45);
}
.glass-strong {
  background: color-mix(in srgb, var(--bg-2) 80%, transparent);
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(2,6,23,.55);
}
.text-glow { text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 46px color-mix(in srgb, var(--accent) 25%, transparent); }

/* Animations */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn  { from { opacity: 0; transform: scale(.92); }    to { opacity: 1; transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.fade-in-up { animation: fadeInUp .55s cubic-bezier(.22,1,.36,1) both; }
.scale-in   { animation: scaleIn .4s  cubic-bezier(.22,1,.36,1) both; }
.shake      { animation: shake .4s ease-in-out; }

/* Barres de résultats : montée fluide 0 → X% */
.result-bar-fill { transition: width 1s cubic-bezier(.22,1,.36,1); }

/* Boutons de réponse : effet « pressed » */
.answer-btn { transition: transform .12s ease, filter .15s ease, box-shadow .2s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.answer-btn:not(:disabled):active, .answer-btn.pressed { transform: scale(.94); filter: brightness(1.25); }
.answer-btn:disabled { cursor: default; }
.btn-a { background: linear-gradient(145deg,#fb7185,#e11d48); box-shadow: 0 12px 34px -10px rgba(225,29,72,.55), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-b { background: linear-gradient(145deg,#60a5fa,#2563eb); box-shadow: 0 12px 34px -10px rgba(37,99,235,.55), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-c { background: linear-gradient(145deg,#fbbf24,#d97706); box-shadow: 0 12px 34px -10px rgba(217,119,6,.55), inset 0 1px 0 rgba(255,255,255,.3); }
.btn-d { background: linear-gradient(145deg,#34d399,#059669); box-shadow: 0 12px 34px -10px rgba(5,150,105,.55), inset 0 1px 0 rgba(255,255,255,.25); }

/* Bande défilante du lobby */
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.marquee-track { display: inline-flex; white-space: nowrap; animation: marquee 26s linear infinite; }

/* QR code : le conteneur généré par qrcodejs est un <table>/<img> — on le
   contraint au parent pour qu'il ne puisse jamais déborder sur mobile. */
.qr-wrap img, .qr-wrap table { max-width: 100% !important; height: auto !important; }

/* Dashboard : formulaires */
.dash-input, .dash-select, .dash-textarea {
  width: 100%;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: calc(var(--radius) * .6);
  padding: .65rem .9rem;
  color: var(--text);
  font-size: .925rem;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.dash-input:focus, .dash-select:focus, .dash-textarea:focus {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.dash-label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: .35rem; font-weight: 600; }
.dash-card { background: color-mix(in srgb, var(--bg-2) 60%, transparent); border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius); padding: 1rem; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #06121f;
  font-weight: 700;
  border: none;
  border-radius: calc(var(--radius) * .6);
  padding: .65rem 1.1rem;
  cursor: pointer;
  transition: transform .12s ease, filter .15s ease;
}
.btn-primary:hover { filter: brightness(1.12); }
.btn-primary:active { transform: scale(.96); }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-dim);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: calc(var(--radius) * .6);
  padding: .55rem .95rem; cursor: pointer; font-weight: 600;
  transition: background .15s ease, color .15s ease;
}
.btn-ghost:hover { background: rgba(255,255,255,.06); color: var(--text); }
.btn-danger { background: rgba(244,63,94,.12); color: #fda4af; border: 1px solid rgba(244,63,94,.35); }
.btn-danger:hover { background: rgba(244,63,94,.2); }

/* Scrollbar discrète */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ════════════════════════════════════════════════════════════════
   MOBILE FIRST — garde-fous anti-débordement (≤ 480 px)
════════════════════════════════════════════════════════════════ */
html, body { max-width: 100%; }
img, svg, video, canvas, code, pre { max-width: 100%; }
input, select, textarea, button { font-size: 16px; }  /* anti-zoom iOS */
input, select, textarea { min-width: 0; max-width: 100%; }  /* anti-débordement flex : autorise le rétrécissement (<input> garde sinon sa largeur intrinsèque) */

/* Texte long insecable : les questions/questions FR ne cassent pas seules */
h1, h2, .break-words { overflow-wrap: break-word; word-wrap: break-word; }

/* Titres géants du host : clamp au lieu de tailwind sm:/lg: seuls */
.host-title { font-size: clamp(1.6rem, 6.5vw, 3.75rem); }
.host-title-xl { font-size: clamp(1.35rem, 5vw, 3rem); }

@media (max-width: 480px) {
  .blob { filter: blur(60px); opacity: .22; }             /* perf mobile */
  .glass, .glass-strong { border-radius: calc(var(--radius) * .8); }

  /* Lobby : QR + code côte à côte → empilés, URL tronquée proprement */
  .lobby-url { max-width: 100%; }

  /* Barre de contrôle flottante : pleine largeur, boutons étirés.
     !important pour vaincre -translate-x-1/2 de Tailwind. */
  .host-controls { left: .75rem !important; right: .75rem !important; transform: none !important; width: auto !important; }
  .host-controls .ctrl-bar { width: 100%; justify-content: stretch; }
  .host-controls button { flex: 1 1 auto; justify-content: center; }

  /* Bandeau défilant : plus discret */
  .marquee-track { animation-duration: 34s; }
}

/* Mode projection : masquage doux de la barre de contrôle + pastille.
   Le bouton ⛶ reste visible partout (desktop inclus) : c'est la seule
   porte d'entrée au plein écran si l'invite a été rejetée. */
.proj-fs-btn { opacity: .75; transition: opacity .3s; }
.proj-fs-btn:hover { opacity: 1; }
.proj-hint { opacity: .8; transition: opacity .4s; }
.proj-invite { transition: opacity .4s; }
.host-controls { transition: opacity .6s cubic-bezier(.4,0,.2,1); }
/* !important : nécessaire pour battre l'animation fade-in-up (fill forwards)
   qui épingle opacity à 1 sinon. */
.host-controls.proj-hidden { opacity: 0 !important; pointer-events: none; }

/* Big Quiz : anneau de timer en alerte (<= 5 s) */
.timer-urgent { animation: timerPulse 1s ease-in-out infinite; }
@keyframes timerPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(244,63,94,.35)); }
  50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(244,63,94,.65)); }
}

/* Podium mobile : blocs côte à côte plus étroits mais lisibles */
@media (max-width: 420px) {
  .podium-col { width: 4.5rem; }
}

/* Respect des préférences système */
@media (prefers-reduced-motion: reduce) {
  .blob, .marquee-track { animation: none; }
  .fade-in-up, .scale-in { animation-duration: .01s; }
  .result-bar-fill { transition-duration: .2s; }
}

   Tous les champs sont optionnels sauf `question`. `phase` regroupe
   visuellement les questions (badge affiché à l'écran animateur).

<script>
/* ════════════════════════════════════════════════════════════════
   CORE — Utilitaires partagés
════════════════════════════════════════════════════════════════ */
'use strict';

const IB = window.IB || (window.IB = {});
IB.util = (() => {
  const genRoomCode = () => {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  };
  const genId = () => 'p_' + Math.random().toString(36).slice(2, 10);

  const getRoomParam = () => {
    const m = window.location.search.match(/[?&]room=([A-Za-z0-9]{4,10})/);
    return m ? m[1].toUpperCase() : '';
  };
  const setRoomParam = (code) => {
    const u = new URL(window.location.href);
    code ? u.searchParams.set('room', code) : u.searchParams.delete('room');
    window.history.replaceState({}, '', u);
  };
  const joinUrlFor = (code) => {
    const u = new URL(window.location.href);
    u.hash = ''; u.search = '?room=' + code;
    return u.toString();
  };
  const hash = () => window.location.hash.replace(/^#\/?/, '') || 'home';

  /* Persistance locale (dashboard, session participant) */
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('ib_' + key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('ib_' + key, JSON.stringify(value)); } catch (e) {}
    },
    del(key) { try { localStorage.removeItem('ib_' + key); } catch (e) {} },
  };

  /* Quiz courant : cache local (repli) > défaut.
     La source officielle en ligne est config/dashboard (via sync). */
  const loadQuiz = () => store.get('quiz', window.IB_DEFAULT_QUIZ);
  const saveQuiz = (quiz) => store.set('quiz', quiz);
  const resetQuiz = () => { store.del('quiz'); return window.IB_DEFAULT_QUIZ; };

  /* Normalisation : garantit des données saines avant envoi */
  const sanitizeQuiz = (quiz) => (Array.isArray(quiz) ? quiz : [])
    .map((q) => {
      const out = { type: q.type || 'mcq', question: String(q.question || '').slice(0, 300) };
      if (q.phase) out.phase = String(q.phase).slice(0, 80);
      const secs = Number(q.seconds);
      if (secs > 0) out.seconds = Math.min(Math.round(secs), 300);  // 0/absent = pas de timer
      if (q.type === 'mcq') out.options = (q.options || []).slice(0, 4).map((o) => String(o).slice(0, 80));
      if (q.type === 'mcq' && q.correctIndex != null) out.correctIndex = Number(q.correctIndex) || 0;
      if (q.type === 'word') { out.placeholder = String(q.placeholder || 'Votre réponse…').slice(0, 60); out.maxLen = Math.min(Number(q.maxLen) || 30, 80); }
      if (q.type === 'number') { out.unit = String(q.unit || '').slice(0, 10); out.maxLen = Math.min(Number(q.maxLen) || 12, 15); if (q.target != null && isFinite(Number(q.target))) out.target = Number(q.target); }
      if (q.type === 'scale') { out.min = Number(q.min) || 1; out.max = Number(q.max) || 10; }
      return out;
    })
    .filter((q) => q.question);

  /* Badge lisible par format */
  const TYPE_BADGE = {
    mcq:    { label: 'Choix multiple', icon: '🔘' },
    word:   { label: 'Nuage de mots',  icon: '☁️' },
    number: { label: 'Estimation',     icon: '🔢' },
    scale:  { label: 'Échelle',        icon: '📏' },
  };
  const typeBadge = (q) => TYPE_BADGE[(q && q.type) || 'mcq'] || TYPE_BADGE.mcq;

  const fmtNum = (v) => (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('fr-FR') : String(Math.round(v * 10) / 10));

  return { genRoomCode, genId, getRoomParam, setRoomParam, joinUrlFor, hash, store, loadQuiz, saveQuiz, resetQuiz, sanitizeQuiz, TYPE_BADGE, typeBadge, fmtNum };
})();

</script>
<script>
/* ════════════════════════════════════════════════════════════════
   CORE — Moteur de résultats (tous formats de question)
   answersMap : { pid: { opt, text, val, q } }
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  const computeResults = (q, answersMap, qIndex) => {
    const type = (q && q.type) || 'mcq';

    if (type === 'mcq') {
      const n = (q.options && q.options.length) || 4;
      const counts = Array(n).fill(0);
      let total = 0;
      Object.values(answersMap || {}).forEach((a) => {
        if (a && a.q === qIndex && a.opt != null && a.opt >= 0 && a.opt < n) { counts[a.opt] += 1; total += 1; }
      });
      return { type, counts, total };
    }

    if (type === 'word') {
      const acc = {};
      let total = 0;
      Object.values(answersMap || {}).forEach((a) => {
        if (!a || a.q !== qIndex || !a.text) return;
        // Éclate les réponses multi-valeurs (« écoute, audace » → 2 mots)
        String(a.text).split(/[,;.]|\bet\b|\//i).map((s) => s.trim().toLowerCase()).filter((w) => w.length >= 1).forEach((w) => {
          acc[w] = (acc[w] || 0) + 1;
          total += 1;
        });
      });
      const words = Object.entries(acc).map(([w, n]) => ({ w, n })).sort((a, b) => b.n - a.n || a.w.localeCompare(b.w));
      return { type, words, distinct: words.length, total };
    }

    if (type === 'number') {
      const entries = [];
      Object.entries(answersMap || {}).forEach(([pid, a]) => {
        if (a && a.q === qIndex && typeof a.val === 'number' && isFinite(a.val)) entries.push({ pid, v: a.val });
      });
      entries.sort((a, b) => a.v - b.v);
      const total = entries.length;
      const avg = total ? entries.reduce((s, e) => s + e.v, 0) / total : 0;
      return { type, entries, total, min: total ? entries[0].v : null, max: total ? entries[total - 1].v : null, avg };
    }

    if (type === 'scale') {
      const min = q.min != null ? q.min : 1, max = q.max != null ? q.max : 10;
      const n = max - min + 1;
      const counts = Array(n).fill(0);
      let total = 0, sum = 0;
      Object.values(answersMap || {}).forEach((a) => {
        if (a && a.q === qIndex && a.opt != null && a.opt >= 0 && a.opt < n) { counts[a.opt] += 1; sum += min + a.opt; total += 1; }
      });
      return { type, counts, total, avg: total ? sum / total : 0 };
    }

    return { type: 'mcq', counts: [], total: 0 };
  };

  const countAnswers = (answersMap, qIndex) =>
    Object.values(answersMap || {}).filter((a) => a && a.q === qIndex && (a.opt != null || a.text || a.val != null)).length;

  /* Attribution des points selon le format :
     mcq → correctIndex · number → plus proche de target · autres → rien */
  const computeWinners = (q, answersMap, qIndex) => {
    const winners = [];
    if ((q.type || 'mcq') === 'mcq' && q.correctIndex != null) {
      Object.entries(answersMap || {}).forEach(([pid, a]) => {
        if (a && a.q === qIndex && a.opt === q.correctIndex) winners.push(pid);
      });
    } else if (q.type === 'number' && q.target != null) {
      let best = Infinity;
      Object.entries(answersMap || {}).forEach(([pid, a]) => {
        if (a && a.q === qIndex && a.val != null) {
          const d = Math.abs(a.val - q.target);
          if (d < best - 1e-9) { best = d; winners.length = 0; winners.push(pid); }
          else if (Math.abs(d - best) < 1e-9) winners.push(pid);
        }
      });
    }
    return winners;
  };

  window.IB.results = { computeResults, countAnswers, computeWinners };
})();

</script>
<script>
/* ════════════════════════════════════════════════════════════════
   CORE — Thème : applique les variables CSS d'un objet thème.
   Un thème = { preset?, vars? }. Les vars surchargent le preset ;
   tout est injecté sur :root en propriétés CSS personnalisées.
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  const applyTheme = (theme) => {
    const root = document.documentElement;
    const presets = window.IB_CONFIG.THEME_PRESETS;
    const t = theme || {};
    const base = t.preset && presets[t.preset] ? presets[t.preset].vars : presets.navy.vars;
    const merged = Object.assign({}, base, t.vars || {});
    Object.entries(merged).forEach(([k, v]) => { if (k.startsWith('--') && v) root.style.setProperty(k, v); });
  };

  /* Recharge la police display dynamiquement (Google Fonts) */
  const loadDisplayFont = (family) => {
    if (!family) return;
    const fam = family.replace(/['"]/g, '').split(',')[0].trim();
    if (!fam) return;
    const id = 'ib-font-display';
    let link = document.getElementById(id);
    if (!link) { link = document.createElement('link'); link.id = id; link.rel = 'stylesheet'; document.head.appendChild(link); }
    link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fam).replace(/%20/g, '+') + ':wght@600;700;800;900&display=swap';
  };

  /* Liste éditable de polices display proposées dans le dashboard */
  const FONT_CHOICES = ['Poppins', 'Inter', 'Montserrat', 'Space Grotesk', 'Playfair Display', 'DM Sans'];

  window.IB.theme = { applyTheme, loadDisplayFont, FONT_CHOICES };
})();

</script>
<script>
/* ════════════════════════════════════════════════════════════════
   CORE — Couche de synchronisation (Firebase ↔ démo locale)
   API unique consommée par les vues :
   - IB.sync.demoMode             → booléen
   - IB.sync.host(room, cbs)      → unsubscribe (cbs: onState/onPlayers/onAnswers/onError)
   - IB.sync.watchRoom(room, cb)  → unsubscribe (participant)
   - IB.sync.join(room, player)   → écriture joueur
   - IB.sync.leave(room, pid)     → retrait joueur
   - IB.sync.vote(room, pid, doc) → écriture réponse {optionIndex|text|val, questionIndex}
   - IB.sync.patchState(room, p)  → patch de l'état de salle
   - IB.sync.clearAnswers(room)   → purge entre questions
   - IB.sync.setScore(room, pid, delta) → incrément de score
   - IB.sync.resetScores(room)    → remise à zéro
   - IB.sync.kick(room, pid)      → exclusion
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  // ib_force_demo=1 → force le mode démo même avec une config Firebase
  // (répétitions sans consommer de quotas).
  const forcedDemo = (() => { try { return localStorage.getItem('ib_force_demo') === '1'; } catch (e) { return false; } })();
  const hasFirebase = typeof firebase !== 'undefined' && !!window.IB_CONFIG.FIREBASE_CONFIG.apiKey && !forcedDemo;
  const demoMode = !hasFirebase;
  const defQuiz = () => window.IB.util.sanitizeQuiz(window.IB.util.loadQuiz());

  /* Initialisation du SDK (compat) — indispensable avant tout usage */
  if (hasFirebase) {
    firebase.initializeApp(window.IB_CONFIG.FIREBASE_CONFIG);
  }

  /* ════════ MODE DÉMO (BroadcastChannel, même navigateur) ════════ */
  const demo = { room: null, channel: null, isHost: false, state: null, players: {}, answers: {} };
  const demoEmit = () => {
    if (demo.channel && demo.isHost) demo.channel.postMessage({ t: 'sync', state: demo.state });
    window.dispatchEvent(new Event('ib-demo-sync'));
  };
  const docFrom = (d) => ({
    opt: d.optionIndex != null ? d.optionIndex : null,
    text: d.text || null,
    val: d.val != null ? d.val : null,
    q: d.questionIndex,
  });

  function demoHost(room, cbs) {
    if (!room) return () => {};   // transition de route : salle pas encore choisie
    demo.room = room; demo.isHost = true;
    demo.state = { room, status: 'waiting', questionIndex: -1, quiz: defQuiz(), quizTitle: window.IB_CONFIG.QUIZ_TITLE, theme: null, lastResults: null, podium: null };
    demo.players = {}; demo.answers = {};
    try { if (demo.channel) demo.channel.close(); } catch (e) {}
    demo.channel = new BroadcastChannel('icebreaker-demo-' + room);
    demo.channel.onmessage = (e) => {
      const m = e.data || {};
      if (m.t === 'join') { demo.players[m.pid] = { pid: m.pid, pseudo: m.pseudo, emoji: m.emoji, score: 0 }; demoEmit(); }
      else if (m.t === 'vote') { demo.answers[m.pid] = docFrom(m.doc || {}); demoEmit(); }
      else if (m.t === 'leave') { delete demo.players[m.pid]; delete demo.answers[m.pid]; demoEmit(); }
    };
    const rerender = () => {
      cbs.onState(demo.state ? { ...demo.state } : null);
      cbs.onPlayers(Object.values(demo.players));
      cbs.onAnswers({ ...demo.answers });
    };
    window.addEventListener('ib-demo-sync', rerender);
    rerender();
    return () => { window.removeEventListener('ib-demo-sync', rerender); try { demo.channel.close(); } catch (e) {} demo.channel = null; demo.isHost = false; };
  }

  function demoWatch(room, me, cbs) {
    if (!room) return () => {};   // transition de route : salle pas encore choisie
    demo.room = room; demo.isHost = false;
    try { if (demo.channel) demo.channel.close(); } catch (e) {}
    demo.channel = new BroadcastChannel('icebreaker-demo-' + room);
    const joinMsg = () => demo.channel.postMessage({ t: 'join', pid: me.pid, pseudo: me.pseudo, emoji: me.emoji });
    joinMsg();
    let joined = false;
    const retry = setInterval(() => { if (!joined) joinMsg(); }, 2000);
    const onMsg = (e) => { const m = e.data || {}; if (m.t === 'sync') { joined = true; demo.state = m.state; cbs.onState(m.state); } };
    demo.channel.addEventListener('message', onMsg);
    const rerender = () => cbs.onState(demo.state ? { ...demo.state } : null);
    window.addEventListener('ib-demo-sync', rerender);
    const leave = () => { try { demo.channel.postMessage({ t: 'leave', pid: me.pid }); } catch (e) {} };
    window.addEventListener('pagehide', leave);
    rerender();
    return () => {
      clearInterval(retry);
      window.removeEventListener('pagehide', leave);
      leave();
      demo.channel.removeEventListener('message', onMsg);
      window.removeEventListener('ib-demo-sync', rerender);
      try { demo.channel.close(); } catch (e) {}
      demo.channel = null;
    };
  }

  const demoApi = {
    host: demoHost,
    watchRoom: demoWatch,
    join: () => {},                                  // géré par watchRoom (BroadcastChannel)
    leave: () => {},
    vote: (room, pid, doc) => {
      if (demo.isHost) { demo.answers[pid] = docFrom(doc); demoEmit(); }
      else if (demo.channel) demo.channel.postMessage({ t: 'vote', pid, doc });
    },
    patchState: (room, patch) => { if (demo.isHost) { demo.state = { ...demo.state, ...patch }; demoEmit(); } },
    clearAnswers: () => { if (demo.isHost) { demo.answers = {}; demoEmit(); } },
    setScore: (room, pid, delta) => {
      if (demo.isHost && demo.players[pid]) { demo.players[pid].score = (demo.players[pid].score || 0) + delta; demoEmit(); }
    },
    resetScores: () => { if (demo.isHost) { Object.values(demo.players).forEach((p) => { p.score = 0; }); demoEmit(); } },
    kick: (room, pid) => { if (demo.isHost) { delete demo.players[pid]; delete demo.answers[pid]; demoEmit(); } },
  };

  /* ════════ MODE FIREBASE (Firestore) ════════ */
  const fs = () => firebase.firestore();
  const roomRef = (room) => fs().collection('rooms').doc(room);

  /* Throttle des snapshots à haute fréquence (300 participants qui
     votent = nombreuses émissions) : on ne re-rend l'UI qu'au plus
     toutes les RATE_MS. Les données restent à jour en continu.   */
  function throttled(fn, rateMs) {
    let pending = null, last = 0;
    return (...args) => {
      pending = args;
      const now = Date.now();
      if (now - last >= rateMs) { last = now; const a = pending; pending = null; fn(...a); }
      else if (!pending._t) {
        pending._t = setTimeout(() => { pending._t = null; last = Date.now(); const a = pending; pending = null; fn(...a); }, rateMs - (Date.now() - last));
      }
    };
  }
  const SNAPSHOT_RATE = 350;   // ms — imperceptible à l'œil, ÷3 le re-rendu

  /* ════════ CONFIG CLOUD (quiz + thème du dashboard) ════════
     Un document unique config/dashboard porte le quiz et le thème
     officiels : édités depuis n'importe quel appareil, lus partout.
     Le localStorage reste un cache local de repli (mode démo). */
  const configRef = () => fs().collection('config').doc('dashboard');
  const fbConfigLoad = async () => {
    try {
      const snap = await configRef().get();
      if (!snap.exists) return null;
      const d = snap.data();
      return { quiz: Array.isArray(d.quiz) ? d.quiz : null, theme: d.theme || null, updatedAt: d.updatedAt || null };
    } catch (e) { return null; }
  };
  const fbConfigSave = async (quiz, theme) => {
    try {
      await configRef().set({ quiz, theme, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      return true;
    } catch (e) { return false; }
  };

  /* Garde anti-crash : une salle vide (transition de route « ← Accueil »)
     ferait jeter Firestore (« empty path ») et démonterait toute l'app. */
  const fbApi = {
    host(room, cbs) {
      if (!room) return () => {};
      roomRef(room).get().then(async (snap) => {
        if (!snap.exists) {
          /* La salle embarque le quiz + thème OFFICIELS du cloud
             (repli : localStorage, puis défauts). */
          let quiz0 = null, theme0 = null;
          try {
            const cfg = await configRef().get();
            if (cfg.exists) {
              const d = cfg.data();
              if (Array.isArray(d.quiz) && d.quiz.length) quiz0 = d.quiz;
              if (d.theme) theme0 = d.theme;
            }
          } catch (e) { /* hors ligne : repli local */ }
          roomRef(room).set({
            room, status: 'waiting', questionIndex: -1,
            quiz: quiz0 || defQuiz(), quizTitle: window.IB_CONFIG.QUIZ_TITLE, theme: theme0,
            lastResults: null, podium: null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          }).catch((e) => cbs.onError('Création salle : ' + e.code));
        }
      });
      const onAnswersT = throttled(cbs.onAnswers, SNAPSHOT_RATE);
      const u1 = roomRef(room).onSnapshot((snap) => cbs.onState(snap.exists ? snap.data() : null), (e) => cbs.onError('État : ' + e.code));
      const u2 = roomRef(room).collection('players').onSnapshot((qs) => cbs.onPlayers(qs.docs.map((d) => d.data())), (e) => cbs.onError('Joueurs : ' + e.code));
      const u3 = roomRef(room).collection('answers').onSnapshot((qs) => {
        const m = {}; qs.forEach((d) => { m[d.id] = docFrom(d.data()); });
        onAnswersT(m);
      }, (e) => cbs.onError('Réponses : ' + e.code));
      return () => { u1(); u2(); u3(); };
    },
    watchRoom(room, me, cbs) {
      if (!room) return () => {};
      const unsub = roomRef(room).onSnapshot((snap) => cbs.onState(snap.exists ? snap.data() : null), (e) => cbs.onError('Lecture salle : ' + e.code));
      const t = setTimeout(() => {
        roomRef(room).get().then((s) => { if (!s.exists) cbs.onError('Salle "' + room + '" introuvable — vérifiez le code'); });
      }, 4000);
      const leave = () => { roomRef(room).collection('players').doc(me.pid).delete().catch(() => {}); };
      window.addEventListener('pagehide', leave);
      return () => { unsub(); clearTimeout(t); window.removeEventListener('pagehide', leave); };
    },
    join(room, player) {
      if (!room) return;
      roomRef(room).collection('players').doc(player.pid).set({
        ...player, score: 0, joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(() => {});
    },
    leave(room, pid) { if (!room) return; roomRef(room).collection('players').doc(pid).delete().catch(() => {}); },
    vote(room, pid, doc) {
      if (!room) return;
      const clean = { questionIndex: doc.questionIndex, at: firebase.firestore.FieldValue.serverTimestamp() };
      if (doc.optionIndex != null) clean.optionIndex = doc.optionIndex;
      if (doc.text) clean.text = String(doc.text).slice(0, 80);
      if (doc.val != null && isFinite(doc.val)) clean.val = Number(doc.val);
      roomRef(room).collection('answers').doc(pid).set(clean).catch(() => {});
    },
    patchState(room, patch) { if (!room) return; roomRef(room).set(patch, { merge: true }).catch(() => {}); },
    async clearAnswers(room) {
      if (!room) return;
      try {
        const snap = await roomRef(room).collection('answers').get();
        if (!snap.empty) {
          const batch = fs().batch();
          snap.docs.forEach((d) => batch.delete(d.ref));
          await batch.commit();
        }
      } catch (e) { /* non bloquant */ }
    },
    setScore(room, pid, delta) {
      if (!room) return;
      roomRef(room).collection('players').doc(pid).update({ score: firebase.firestore.FieldValue.increment(delta) }).catch(() => {});
    },
    async resetScores(room) {
      if (!room) return;
      try {
        const snap = await roomRef(room).collection('players').get();
        const batch = fs().batch();
        snap.docs.forEach((d) => batch.update(d.ref, { score: 0 }));
        if (!snap.empty) await batch.commit();
      } catch (e) { /* non bloquant */ }
    },
    kick(room, pid) { if (!room) return; roomRef(room).collection('players').doc(pid).delete().catch(() => {}); },
  };

  /* API unifiée : en ligne, quiz/thème du dashboard passent par le
     cloud ; en démo, par le localStorage (comportement historique). */
  window.IB.sync = {
    demoMode,
    ...(demoMode ? demoApi : {
      ...fbApi,
      loadDashboard: fbConfigLoad,
      saveDashboard: fbConfigSave,
    }),
  };
})();

</script>
<script>
/* ════════════════════════════════════════════════════════════════
   AUDIO — MELTIN QUIZ (façon Kahoot, 100 % WebAudio, zéro fichier)
   Sons synthétisés à la volée : aucun asset à télécharger, aucun
   droit d'auteur, latence nulle. Toutes les méthodes sont silencieuses
   si le son est coupé (ib_sound=off) ou si WebAudio est indisponible.
   L'AudioContext est créé/resumé au premier geste utilisateur
   (politique autoplay des navigateurs) via unlock().
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  let ctx = null;
  const store = window.IB.util.store;
  const isEnabled = () => store.get('sound', true);

  function ensureCtx() {
    if (!isEnabled()) return null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx.state === 'running' || ctx.state === 'suspended' ? ctx : null;
    } catch (e) { return null; }
  }

  /* Oscillateur enveloppé : la brique de base de tous les sons */
  function tone({ freq = 440, dur = 0.12, type = 'sine', vol = 0.18,
                  delay = 0, slideTo = null, attack = 0.005 }) {
    const c = ensureCtx();
    if (!c) return;
    try {
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    } catch (e) { /* jamais bloquant */ }
  }

  /* Bruit filtré : cymbale/whoosh sans échantillon */
  function noise({ dur = 0.3, vol = 0.12, delay = 0, freq = 3000, q = 0.8, slideTo = null }) {
    const c = ensureCtx();
    if (!c) return;
    try {
      const t0 = c.currentTime + delay;
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const filt = c.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.setValueAtTime(freq, t0); filt.Q.value = q;
      if (slideTo) filt.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      const gain = c.createGain();
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filt).connect(gain).connect(c.destination);
      src.start(t0);
    } catch (e) {}
  }

  const SFX = {
    /* Lancement d'une question : montée d'adrénaline (le "drum roll" Kahoot) */
    questionStart() {
      tone({ freq: 220, slideTo: 880, dur: 0.45, type: 'sawtooth', vol: 0.10 });
      tone({ freq: 440, slideTo: 1760, dur: 0.45, type: 'triangle', vol: 0.08, delay: 0.05 });
      noise({ dur: 0.5, freq: 600, slideTo: 4000, vol: 0.06 });
    },
    /* Tick d'horloge du timer (accélère visuellement le stress) */
    tick(urgent) {
      tone({ freq: urgent ? 880 : 660, dur: 0.05, type: 'square', vol: urgent ? 0.14 : 0.08 });
    },
    /* Verrouillage du vote sur le téléphone */
    lock() {
      tone({ freq: 520, dur: 0.08, type: 'triangle', vol: 0.14 });
      tone({ freq: 780, dur: 0.1, type: 'triangle', vol: 0.12, delay: 0.07 });
    },
    /* Temps écoulé : haut strident */
    timeUp() {
      tone({ freq: 990, dur: 0.5, type: 'sawtooth', vol: 0.12, slideTo: 220 });
      noise({ dur: 0.4, freq: 2000, slideTo: 300, vol: 0.08, delay: 0.05 });
    },
    /* Révélation des résultats */
    reveal() {
      tone({ freq: 392, dur: 0.14, type: 'triangle', vol: 0.12 });
      tone({ freq: 523, dur: 0.14, type: 'triangle', vol: 0.12, delay: 0.1 });
    },
    /* Bonne réponse (participant) : arpège majeur montant */
    good() {
      [523, 659, 784, 1047].forEach((f, i) =>
        tone({ freq: f, dur: 0.16, type: 'triangle', vol: 0.13, delay: i * 0.07 }));
    },
    /* Mauvaise réponse (participant) : descente dissonante */
    bad() {
      tone({ freq: 311, slideTo: 155, dur: 0.4, type: 'sawtooth', vol: 0.1 });
      tone({ freq: 330, slideTo: 165, dur: 0.4, type: 'square', vol: 0.05, delay: 0.03 });
    },
    /* Podium final : fanfare */
    fanfare() {
      const seq = [[392, 0], [392, .15], [392, .3], [523, .45], [659, .68], [784, .9], [1047, 1.15]];
      seq.forEach(([f, d]) => tone({ freq: f, dur: d > .6 ? 0.5 : 0.16, type: 'triangle', vol: 0.13, delay: d }));
      noise({ dur: 0.7, freq: 5000, vol: 0.05, delay: 1.15 });
    },
  };

  /* API : chaque méthode est un no-op sonore si le son est coupé */
  const api = {};
  Object.keys(SFX).forEach((k) => { api[k] = (...a) => { if (isEnabled()) SFX[k](...a); }; });

  /* Premier geste utilisateur → autorise les sons (autoplay policy) */
  let unlocked = false;
  api.unlock = () => {
    if (unlocked) return;
    unlocked = true;
    ensureCtx();
  };
  ['pointerdown', 'keydown', 'touchstart'].forEach((e) =>
    window.addEventListener(e, api.unlock, { once: true, passive: true }));

  api.enabled = isEnabled;
  api.setEnabled = (on) => { store.set('sound', !!on); if (on) { unlocked = true; ensureCtx(); } };

  window.IB.audio = api;
})();

</script>
<script type="text/babel" data-presets="react">
/* ════════════════════════════════════════════════════════════════
   UI — Composants partagés (React)
════════════════════════════════════════════════════════════════ */
'use strict';

const { useState, useEffect, useRef, useCallback } = React;

/* QR code généré localement (qrcodejs), fallback API publique */
function QrCode({ text, size }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.innerHTML = '';
    try {
      if (window.QRCode) {
        new window.QRCode(el, {
          text, width: size, height: size,
          colorDark: '#22d3ee', colorLight: '#0f172a',
          correctLevel: window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : 0,
        });
        return;
      }
    } catch (e) { /* fallback */ }
    const img = document.createElement('img');
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size +
      '&bgcolor=10-18-34&color=22-d3-ee&data=' + encodeURIComponent(text);
    img.alt = 'QR code'; img.width = size; img.height = size; img.className = 'rounded-xl';
    el.appendChild(img);
  }, [text, size]);
  return <div ref={ref} className="qr-wrap inline-block rounded-xl bg-slate-900 p-2 border border-white/10 max-w-full" />;
}

/* Garde-fou : une vue qui plante affiche un écran d'erreur au lieu
d'une page blanche (React 18 démonte sinon tout l'arbre). */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('[MELTIN QUIZ] Crash de vue :', err, info && info.componentStack); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center">
        <div className="glass-strong p-8 max-w-sm w-full fade-in-up">
          <div className="text-5xl mb-4">😵</div>
          <h2 className="font-display text-xl font-bold mb-2">Oups, un pépin d'affichage</h2>
          <p className="text-sm mb-5" style={{ color: 'var(--text-dim)' }}>
            Un élément de l'écran a planté, mais l'application tourne toujours.
          </p>
          <button onClick={() => this.setState({ err: null })}
            className="w-full py-3 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white shadow-lg shadow-cyan-500/25 transition-all active:scale-[0.98]">
            Réessayer
          </button>
          <button onClick={() => { location.hash = '#/'; }}
            className="mt-3 w-full py-3 text-sm hover:text-slate-300 transition" style={{ color: 'var(--text-dim)' }}>
            ← Retour à l'accueil
          </button>
        </div>
      </div>
    );
  }
}

/* Toast flottant */
function Toast({ toast }) {
  if (!toast) return null;
  const styles = toast.type === 'error'
    ? 'bg-rose-500/15 border-rose-400/40 text-rose-100'
    : 'bg-emerald-500/15 border-emerald-400/40 text-emerald-100';
  return (
    <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[100] fade-in-up">
      <div className={'glass-strong px-5 py-3 rounded-2xl border text-sm font-semibold flex items-center gap-2 ' + styles}>
        <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
        <span>{toast.msg}</span>
      </div>
    </div>
  );
}

/* Indicateur de connexion temps réel */
function ConnectionStatus({ online }) {
  if (online) return null; // On ne montre rien si tout va bien
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] fade-in">
      <div className="glass-strong bg-rose-500/20 border-rose-500/40 text-rose-200 px-4 py-2 rounded-full text-xs font-medium flex items-center gap-2 border">
        <span className="relative flex h-2 w-2">
          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
          <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
        </span>
        Connexion perdue... tentative de reconnexion
      </div>
    </div>
  );
}


/* ────────────────────────────────────────────────────────────────
   CORPS DE RÉSULTATS PARTAGÉ — rend le graphique du bon format.
   mini : version compacte (mobile) · nameOf : pid → pseudo
──────────────────────────────────────────────────────────────── */
function ResultBody({ q, r, mounted, mini, myAnswer, nameOf }) {
  const type = (r && r.type) || 'mcq';
  const WCOLORS = ['#22d3ee', '#a78bfa', '#34d399', '#fbbf24', '#f472b6', '#60a5fa'];
  const OPT = window.IB_CONFIG.OPT_COLOR, GRAD = window.IB_CONFIG.OPT_GRADIENT;

  if (!r || !r.total) return <div className="text-center py-8 text-slate-500">Aucune réponse reçue pour cette question.</div>;

  /* QCM : barres horizontales animées */
  if (type === 'mcq') {
    const rows = r.counts || [];
    const top = rows.length ? Math.max(...rows) : 0;
    return (
      <div className={mini ? 'space-y-4' : 'space-y-5'}>
        {(q.options || []).map((opt, i) => {
          const count = rows[i] || 0;
          const pct = Math.round((count / r.total) * 100);
          const isTop = count > 0 && count === top;
          return (
            <div key={i}>
              <div className="flex justify-between items-baseline mb-1.5">
                <span className={'font-semibold truncate pr-3 ' + (mini ? 'text-sm ' : '') + (myAnswer === i ? 'text-cyan-300' : 'text-slate-300')}>
                  {myAnswer === i ? '➜ ' : ''}{opt}
                </span>
                <span className={'font-mono text-slate-400 shrink-0 ' + (mini ? 'text-xs' : 'text-sm')}>{pct}% · {count}</span>
              </div>
              <div className={(mini ? 'h-3.5' : 'h-6') + ' bg-white/5 rounded-full overflow-hidden'}>
                <div className="result-bar-fill h-full rounded-full relative"
                  style={{
                    width: mounted ? pct + '%' : '0%',
                    background: GRAD[i],
                    boxShadow: '0 0 ' + (mini ? '12px ' : '20px ') + OPT[i] + '55' + (mini ? '' : ', inset 0 1px 0 rgba(255,255,255,.35)'),
                  }}>
                  {!mini && isTop && <span className="absolute right-2 top-1/2 -translate-y-1/2 text-lg">👑</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  /* Nuage de mots — TOP mots seulement (perf à 300 participants) */
  if (type === 'word') {
    const words = (r.words || []).slice(0, mini ? 8 : 24);
    const maxN = words.length ? Math.max(...words.map((x) => x.n)) : 1;
    return (
      <div>
        <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-3 py-4">
          {words.map((x, i) => (
            <span key={i} className="scale-in font-bold leading-none"
              style={{
                fontSize: (mini ? 15 : 20) + Math.round((x.n / maxN) * (mini ? 14 : 28)) + 'px',
                color: WCOLORS[i % WCOLORS.length],
                opacity: 0.5 + 0.5 * (x.n / maxN),
                animationDelay: Math.min(i * 0.05, 0.5) + 's',
              }}>
              {x.w}{x.n > 1 && <span className="text-slate-500 text-xs font-sans ml-1">×{x.n}</span>}
            </span>
          ))}
        </div>
        <p className="text-center text-xs text-slate-500 mt-2">{r.distinct} réponse{r.distinct > 1 ? 's' : ''} différente{r.distinct > 1 ? 's' : ''} · {r.total} au total</p>
      </div>
    );
  }

  /* Estimation chiffrée */
  if (type === 'number') {
    const entries = r.entries || [];
    const hasTarget = q.target != null;
    let ranked = entries;
    if (hasTarget) ranked = [...entries].sort((a, b) => Math.abs(a.v - q.target) - Math.abs(b.v - q.target));
    const shown = ranked.slice(0, mini ? 3 : 8);
    const fmt = window.IB.util.fmtNum;
    return (
      <div>
        {hasTarget && (
          <div className="text-center mb-5">
            <span className="glass rounded-2xl px-5 py-2 inline-block">
              <span className="text-slate-400 text-sm">Réponse cible : </span>
              <span className="font-display font-black text-amber-300 text-xl">{fmt(q.target)} {q.unit || ''}</span>
            </span>
          </div>
        )}
        <div className="space-y-2.5">
          {shown.map((e, i) => {
            const delta = hasTarget ? Math.abs(e.v - q.target) : null;
            return (
              <div key={i} className={'scale-in flex items-center gap-3 rounded-2xl px-4 py-3 ' + (i === 0 && hasTarget ? 'bg-amber-500/10 border border-amber-400/30' : 'bg-white/5')} style={{ animationDelay: i * 0.06 + 's' }}>
                <span className="text-xl">{hasTarget ? ['🎯', '🥈', '🥉'][i] || (i + 1) + '.' : '👤'}</span>
                <span className="font-bold flex-1 truncate">{nameOf ? nameOf(e.pid) || 'Anonyme' : 'Participant'}</span>
                <span className="font-mono font-black text-cyan-300">{fmt(e.v)} {q.unit || ''}</span>
                {delta != null && <span className="font-mono text-xs text-slate-500">Δ {fmt(delta)}</span>}
              </div>
            );
          })}
        </div>
        <div className="grid grid-cols-3 gap-2 mt-5 text-center">
          {[['Min', r.min], ['Moyenne', Math.round(r.avg * 10) / 10], ['Max', r.max]].map(([lbl, v], i) => (
            <div key={i} className="glass rounded-2xl py-3">
              <div className="text-[11px] uppercase tracking-wider text-slate-500">{lbl}</div>
              <div className="font-display font-black text-lg text-slate-200">{v == null ? '—' : fmt(v)}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* Échelle : distribution + moyenne */
  if (type === 'scale') {
    const min = q.min != null ? q.min : 1, max = q.max != null ? q.max : 10;
    const rows = r.counts || [];
    const maxN = Math.max(...rows, 1);
    return (
      <div>
        <div className="text-center mb-5">
          <span className="font-display text-6xl font-black bg-clip-text text-transparent"
            style={{ backgroundImage: 'linear-gradient(90deg, var(--accent), var(--accent-2))' }}>
            {Math.round(r.avg * 10) / 10}
          </span>
          <span className="text-slate-500 text-lg"> / {max}</span>
          <div className="text-xs text-slate-500 mt-1">score moyen · {r.total} réponse{r.total > 1 ? 's' : ''}</div>
        </div>
        <div className="flex items-end gap-1.5" style={{ height: mini ? '90px' : '150px' }}>
          {rows.map((count, i) => {
            const pct = (count / maxN) * 100;
            const val = min + i;
            return (
              <div key={i} className="flex-1 flex flex-col items-center gap-1 h-full justify-end">
                <span className="font-mono text-[10px] text-slate-400">{count || ''}</span>
                <div className="result-bar-fill w-full rounded-t-lg"
                  style={{
                    height: mounted ? Math.max(pct, 3) + '%' : '0%',
                    background: 'linear-gradient(180deg,#22d3ee,#7c3aed)',
                    boxShadow: '0 0 14px rgba(34,211,238,.35)',
                    opacity: 0.55 + 0.45 * (val / max),
                  }} />
                <span className="font-mono text-[10px] text-slate-500">{val}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }
  return null;
}

window.IB.ui = { QrCode, Toast, ResultBody, ConnectionStatus };

</script>

   VIEW — Participant (mobile first)

(function () {

  function ParticipantWait({ me, hint }) {

      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center fade-in-up">
        <div className="relative w-28 h-28 mb-8">
          <div className="absolute inset-0 rounded-full border-4 border-cyan-500/20"></div>
