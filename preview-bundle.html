  }

  /* Vote : UI adaptée au format de la question.
     Big Quiz : barre de temps en haut, verrouillage auto à 0. */
  function ParticipantVote({ q, qIndex, total, me, onVote, endsAt }) {
    // (en-tête wrappé : voir JSX ci-dessous)
    const type = (q && q.type) || 'mcq';
    const [selected, setSelected] = useState(null);
    const [text, setText] = useState('');
    const scaleMin = q.min != null ? q.min : 1;
    const [scaleVal, setScaleVal] = useState(scaleMin);
    const done = selected !== null && selected !== undefined;
    const OPT = window.IB_CONFIG.OPT_LABEL;
    const badge = U().typeBadge(q);
    const min = q.min != null ? q.min : 1, max = q.max != null ? q.max : 10;

    /* Timer local : horloge du téléphone, zéro écriture. À 0, on
       verrouille (le « temps écoulé » retentit côté animateur). */
    const [now, setNow] = useState(Date.now());
    const expired = endsAt ? endsAt - now <= 0 : false;
    const locked = done || expired;
    useEffect(() => {
      if (!endsAt || done) return undefined;
      const iv = setInterval(() => setNow(Date.now()), 250);
      return () => clearInterval(iv);
    }, [endsAt, done]);
    const leftMs = endsAt ? Math.max(0, endsAt - now) : null;
    const totalMs = (q.seconds > 0 ? q.seconds : 30) * 1000;
    const pct = leftMs != null ? Math.max(0, Math.min(1, leftMs / totalMs)) : 1;
    const urgent = leftMs != null && leftMs <= 5000;

    const submit = (payload, visualIndex) => {
      if (locked) return;
      setSelected(visualIndex != null ? visualIndex : -1);
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
      window.IB.audio.lock();
      onVote(payload);
    };

    return (
      <div className="min-h-screen flex flex-col px-4 py-6 max-w-lg mx-auto w-full fade-in-up">
        {/* Barre de temps Big Quiz (fine, pleine largeur) */}
        {leftMs != null && !done && (
          <div className="sticky top-0 -mx-4 px-4 pt-1 pb-2 z-20 bg-gradient-to-b from-slate-950/90 to-transparent">
            <div className="flex items-center justify-between text-[11px] font-mono mb-1" style={{ color: urgent ? '#fb7185' : 'var(--text-dim)' }}>
              <span>{urgent ? '⏰ Dernières secondes !' : '⏱ Temps restant'}</span>
              <span className={urgent ? 'font-black' : ''}>{Math.ceil(leftMs / 1000)}s</span>
            </div>
            <div className="h-2 rounded-full bg-white/10 overflow-hidden">
              <div className="h-full rounded-full transition-all duration-300 ease-linear"
                style={{ width: (pct * 100) + '%', background: urgent ? 'linear-gradient(90deg,#fb7185,#e11d48)' : 'linear-gradient(90deg,var(--accent),var(--accent-2))' }} />
            </div>
          </div>
        )}
        {expired && !done && (
          <div className="glass px-4 py-3 mb-4 text-center text-rose-300 text-sm font-semibold fade-in">
            ⏰ Temps écoulé — réponses verrouillées
          </div>
        )}
        <div className="flex items-center gap-2 mb-4 min-w-0">
          <div className="text-xs font-mono bg-white/5 rounded-full px-3 py-1 shrink-0" style={{ color: 'var(--text-dim)' }}>Q{qIndex + 1}/{total}</div>
          <div className="text-xs bg-violet-500/10 border border-violet-400/30 text-violet-300 rounded-full px-3 py-1 truncate">{badge.icon} {badge.label}</div>
          <div className="flex-1 min-w-2" />
          <div className="text-xs truncate max-w-[6rem] shrink-0" style={{ color: 'var(--text-dim)' }}>{me.emoji} {me.pseudo}</div>
        </div>

        <div className="glass p-6 text-center mb-5">
          <h2 className="font-display text-xl sm:text-2xl font-bold leading-snug">{q.question}</h2>
        </div>

        {type === 'mcq' && (
          <div className="grid gap-3">
            {(q.options || []).map((opt, i) => (
              <button key={i} onClick={() => submit({ opt: i }, i)} disabled={locked}
                className={'answer-btn btn-' + OPT[i].toLowerCase() + ' rounded-2xl px-5 py-5 flex items-center gap-4 text-left text-white font-bold text-base sm:text-lg' + (selected === i ? ' pressed ring-4 ring-white/40' : '')}>
                <span className="w-10 h-10 rounded-xl bg-black/25 flex items-center justify-center font-display text-xl shrink-0">{OPT[i]}</span>
                <span className="leading-snug">{opt}</span>
              </button>
            ))}
          </div>
        )}

        {type === 'scale' && (
          <div className="glass p-6">
            <div className="text-center mb-4">
            <span className="font-display text-6xl font-black bg-clip-text text-transparent"
              style={{ backgroundImage: 'linear-gradient(90deg, var(--accent), var(--accent-2))' }}>
              {done && selected >= 0 ? min + selected : scaleVal}
            </span>
              <span className="text-lg" style={{ color: 'var(--text-dim)' }}> / {max}</span>
            </div>
            <input type="range" min={min} max={max} step="1" value={scaleVal} disabled={locked}
              onChange={(e) => setScaleVal(Number(e.target.value))}
              onMouseUp={() => submit({ opt: scaleVal - min }, scaleVal - min)}
              onTouchEnd={() => submit({ opt: scaleVal - min }, scaleVal - min)}
              className="w-full accent-cyan-400 h-3 cursor-pointer" />
            <div className="flex justify-between text-xs mt-2 font-mono" style={{ color: 'var(--text-dim)' }}>
              <span>{min} · pas du tout</span><span>{max} · totalement</span>
            </div>
            {!done && (
              <button onClick={() => submit({ opt: scaleVal - min }, scaleVal - min)}
                className="mt-4 w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white shadow-lg shadow-cyan-500/25 transition-all active:scale-[0.98]">
                Confirmer {scaleVal} / {max}
              </button>
            )}
          </div>
        )}

        {type === 'word' && (
          <div className="glass p-6">
            <input value={text}
              onChange={(e) => setText(e.target.value.slice(0, q.maxLen || 30))}
              onKeyDown={(e) => { if (e.key === 'Enter' && text.trim().length >= 2) submit({ text: text.trim() }, -1); }}
              placeholder={q.placeholder || 'Votre réponse…'}
              disabled={locked} autoFocus
              className="w-full bg-black/30 border border-white/15 rounded-2xl px-5 py-4 text-lg text-center focus:outline-none focus:border-violet-400/60 focus:ring-2 focus:ring-violet-400/20 transition disabled:opacity-50" />
            <button onClick={() => text.trim().length >= 2 && submit({ text: text.trim() }, -1)}
              disabled={text.trim().length < 2 || locked}
              className="mt-4 w-full py-4 rounded-2xl bg-gradient-to-r from-violet-500 to-fuchsia-600 disabled:opacity-30 font-bold text-lg text-white shadow-lg shadow-violet-500/25 transition-all active:scale-[0.98]">
              Envoyer ✨
            </button>
          </div>
        )}

        {type === 'number' && (
          <div className="glass p-6">
            <div className="flex items-center gap-2">
              <input type="text" inputMode="decimal" value={text}
                onChange={(e) => setText(e.target.value.replace(',', '.').replace(/[^0-9.]/g, ''))}
                onKeyDown={(e) => { if (e.key === 'Enter' && text !== '' && isFinite(Number(text))) submit({ val: Number(text) }, -1); }}
                placeholder="0" disabled={locked} autoFocus size="1"
                className="min-w-0 flex-1 w-full bg-black/30 border border-white/15 rounded-2xl px-4 py-4 text-2xl sm:text-3xl text-center font-display font-black focus:outline-none focus:border-amber-400/60 focus:ring-2 focus:ring-amber-400/20 transition disabled:opacity-50" />
              {q.unit && <span className="text-xl font-bold shrink-0" style={{ color: 'var(--text-dim)' }}>{q.unit}</span>}
            </div>
            <button onClick={() => text !== '' && isFinite(Number(text)) && submit({ val: Number(text) }, -1)}
              disabled={text === '' || !isFinite(Number(text)) || locked}
              className="mt-4 w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 disabled:opacity-30 font-bold text-lg text-white shadow-lg shadow-amber-500/25 transition-all active:scale-[0.98]">
              Valider mon estimation 🎯
            </button>
          </div>
        )}

        {done && (
          <div className="mt-6 text-center fade-in-up">
            <div className="inline-flex items-center gap-2 glass rounded-full px-5 py-2.5 text-emerald-300 font-semibold text-sm">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Réponse enregistrée — en attente des résultats…
            </div>
          </div>
        )}
      </div>
    );
  }

  function ParticipantResults({ qIndex, total, results, q, myAnswer }) {
    const [mounted, setMounted] = useState(false);
    useEffect(() => { const t = setTimeout(() => setMounted(true), 100); return () => clearTimeout(t); }, [qIndex]);
    /* Feedback sonore : bonne réponse (QCM) ou estimation la plus proche */
    useEffect(() => {
      if (!results || results.total == null) return;
      if (myAnswer == null || myAnswer < 0) return;
      let won = false;
      if (q.type === 'mcq' && q.correctIndex != null) won = myAnswer === q.correctIndex;
      else if (q.type === 'number' && q.target != null && results.entries) {
        const mine = results.entries.find((e) => e.v === myAnswer);
        const best = results.entries.reduce((m, e) => Math.abs(e.v - q.target) < Math.abs(m - q.target) ? e.v : m, Infinity);
        won = mine != null && Math.abs(myAnswer - q.target) <= Math.abs(best - q.target) + 1e-9;
      }
      if (won) window.IB.audio.good(); else window.IB.audio.bad();
    }, [results && results.total, qIndex]);
    const r = results || {};
    return (
      <div className="min-h-screen flex flex-col px-5 py-8 max-w-lg mx-auto w-full fade-in-up">
        <div className="text-center mb-6">
          <div className="text-5xl mb-3">📊</div>
          <h2 className="font-display text-2xl font-bold">Résultats !</h2>
          <p className="text-sm mt-1" style={{ color: 'var(--text-dim)' }}>Question {qIndex + 1}/{total} — {r.total || 0} réponse{(r.total || 0) > 1 ? 's' : ''}</p>
        </div>
        <div className="glass p-5">
          <ResultBody q={q} r={r} mounted={mounted} mini myAnswer={myAnswer} />
        </div>
        <p className="mt-6 text-center text-sm" style={{ color: 'var(--text-dim)' }}>La suite arrive… regardez l'écran principal 👀</p>
      </div>
    );
  }

  function ParticipantPodium({ podium, myPid }) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center fade-in-up">
        <div className="text-6xl mb-4">🏆</div>
        <h2 className="font-display text-3xl font-black bg-gradient-to-r from-amber-300 to-yellow-500 bg-clip-text text-transparent mb-2">Podium final</h2>
        <p className="text-sm mb-8" style={{ color: 'var(--text-dim)' }}>Merci d'avoir joué !</p>
        {podium && podium.length > 0 ? (
          <div className="glass p-6 w-full max-w-sm space-y-3">
            {podium.map((p, i) => (
              <div key={i} className={'flex items-center gap-3 rounded-2xl px-4 py-3 ' + (p.pid === myPid ? 'bg-cyan-500/10 border border-cyan-400/30' : 'bg-white/5')}>
                <span className="text-2xl">{['🥇','🥈','🥉'][i] || (i + 1) + '.'}</span>
                <span className="font-bold flex-1 text-left">{p.emoji} {p.pseudo}</span>
                <span className="font-mono text-cyan-300 font-bold">{p.score} pts</span>
              </div>
            ))}
          </div>
        ) : (
          <div className="glass px-6 py-4" style={{ color: 'var(--text-dim)' }}>Session terminée, à bientôt ! 👋</div>
        )}
      </div>
    );
  }

  /* Orchestration du flux participant */
  function ParticipantFlow({ room, showToast, onBack }) {
    const [me, setMe] = useState(null);
    const [state, setState] = useState(null);
    const [isOnline, setIsOnline] = useState(true);
    const myVoteRef = useRef(null);
    const lastQKeyRef = useRef('');

    const enter = (pseudo, emoji) => {
      const pid = U().genId();
      setMe({ pid, pseudo, emoji });
      window.IB.sync.join(room, { pid, pseudo, emoji });
    };

    useEffect(() => {
      if (!me) return undefined;
      return window.IB.sync.watchRoom(room, me, {
        onState: (s) => {
          setState(s);
          setIsOnline(true);
        },
        onError: (msg) => {
          showToast(msg, 'error');
          setIsOnline(false);
        },
      });
    }, [me && me.pid, room]);

    /* Reset du vote local PENDANT le rendu (pas en effet) */
    const qKey = state ? state.status + ':' + state.questionIndex : '';
    if (qKey !== lastQKeyRef.current) {
      if (state && state.status === 'question') myVoteRef.current = null;
      lastQKeyRef.current = qKey;
    }

    if (!me) return <ParticipantJoin room={room} onEnter={enter} onBack={onBack} />;
    if (!state) return <ParticipantWait me={me} hint={window.IB.sync.demoMode
      ? "En attente de l'animateur… ouvrez l'écran Animateur dans un autre onglet de ce navigateur."
      : undefined} />;

    const quiz = state.quiz || U().loadQuiz();
    const q = quiz[state.questionIndex];

    const castVote = (payload) => {
      myVoteRef.current = payload.opt != null ? payload.opt : -1;
      const doc = { questionIndex: state.questionIndex };
      if (payload.opt != null) doc.optionIndex = payload.opt;
      if (payload.text) doc.text = String(payload.text).slice(0, 80);
      if (payload.val != null && isFinite(payload.val)) doc.val = Number(payload.val);
      window.IB.sync.vote(room, me.pid, doc);
    };

    const content = (
      <>
        <window.IB.ui.ConnectionStatus online={isOnline} />
        {state.status === 'question' && q && (
          <ParticipantVote key={state.questionIndex} q={q} qIndex={state.questionIndex} total={quiz.length} me={me} onVote={castVote} endsAt={state.questionEndsAt} />
        )}
        {state.status === 'results' && q && (
          <ParticipantResults qIndex={state.questionIndex} total={quiz.length} results={state.lastResults} q={q} myAnswer={myVoteRef.current} />
        )}
        {state.status === 'podium' && (
          <ParticipantPodium podium={state.podium} myPid={me.pid} />
        )}
        {state.status !== 'question' && state.status !== 'results' && state.status !== 'podium' && (
          <ParticipantWait me={me} />
        )}
      </>
    );

    return content;
  }

  window.IB.views = window.IB.views || {};
  window.IB.views.ParticipantFlow = ParticipantFlow;
})();

</script>
<script type="text/babel" data-presets="react">
/* ════════════════════════════════════════════════════════════════
   VIEW — Animateur (grand écran)
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  const U = () => window.IB.util;
  const R = () => window.IB.results;
  const OPT_LABEL = () => window.IB_CONFIG.OPT_LABEL;
  /* Contexte : l'état « contrôles masqués » diffuse aux boutons sans
     re-rendre les grands écrans (perf vidéoprojecteur). */
  const ProjCtx = React.createContext({ hidden: false });

  function HostLobby({ room, joinUrl, players, onKick, onStart, onExit, quizTitle, questionCount }) {
    const [copied, setCopied] = useState(false);
    const [search, setSearch] = useState('');
    const noQuestions = !questionCount;
    // Plafond de rendu : 150 chips max (le compteur, lui, reste exact).
    const MAX_CHIPS = 150;
    const filtered = search.trim()
      ? players.filter((p) => p.pseudo.toLowerCase().includes(search.trim().toLowerCase()))
      : players;
    const shownPlayers = filtered.slice(0, MAX_CHIPS);
    const hiddenCount = filtered.length - shownPlayers.length;
    const copy = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(joinUrl).catch(() => {});
      setCopied(true); setTimeout(() => setCopied(false), 1600);
    };
    return (
      <div className="min-h-screen px-3 sm:px-4 py-6 sm:py-8 pb-20 fade-in-up">
        <div className="max-w-6xl mx-auto">
          {/* Retour accueil (le lobby n'a pas de barre de contrôle) — dans le
              flux pour ne jamais chevaucher le badge mode sur mobile */}
          <button onClick={onExit} title="Retour à l'accueil"
            className="glass rounded-xl px-4 py-2 text-sm font-semibold hover:bg-white/10 transition inline-flex items-center gap-2 active:scale-95 mb-3">
            ← Accueil
          </button>
        </div>
        <div className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-8 items-start">
          <div className="text-center lg:text-left min-w-0">
            <div className="inline-block glass px-4 py-1.5 text-xs font-semibold tracking-widest text-cyan-300 mb-4">
              {window.IB.sync.demoMode ? '🔧 MODE DÉMO LOCAL' : '🌐 MODE EN LIGNE'}
            </div>
            <h1 className="font-display text-3xl sm:text-4xl lg:text-5xl font-black mb-2 break-words">
              Salle <span className="font-mono bg-clip-text text-transparent text-glow"
                style={{ backgroundImage: 'linear-gradient(90deg, var(--accent), var(--accent-2))' }}>{room}</span>
            </h1>
            <p className="mb-5 sm:mb-6 break-words" style={{ color: 'var(--text-dim)' }}>{quizTitle || 'Quiz interactif en direct'}</p>
            {/* Carte QR : block + max-width, jamais dimensionnée par l'URL */}
            <div className="glass-strong p-4 sm:p-6 inline-block max-w-full">
              <QrCode text={joinUrl} size={210} />
              <div className="mt-3 sm:mt-4 flex items-center gap-2 justify-center max-w-full">
                <code className="lobby-url text-cyan-300 font-mono text-[11px] sm:text-xs bg-black/40 rounded-lg px-3 py-2 border border-white/10 select-all truncate min-w-0">{joinUrl}</code>
                <button onClick={copy} title="Copier le lien" className="glass px-3 py-2 text-sm hover:bg-white/10 transition shrink-0">{copied ? '✅' : '📋'}</button>
              </div>
              <p className="text-xs mt-3" style={{ color: 'var(--text-dim)' }}>Scannez pour rejoindre depuis votre téléphone</p>
            </div>
          </div>

          <div className="glass p-4 sm:p-6 min-w-0">
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-display font-bold text-lg flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Participants connectés
              </h2>
              <span className="font-display text-3xl font-black text-cyan-300">{players.length}</span>
            </div>
            {players.length === 0 ? (
              <div className="text-center py-10" style={{ color: 'var(--text-dim)' }}>
                <div className="text-4xl mb-3 animate-bounce">👀</div>
                En attente des premiers participants…
              </div>
            ) : (
              <div>
                {/* Grandes sessions : on plafonne le DOM rendu (perf vidéo-
                    projecteur) ; la recherche retrouve tout le monde. */}
                {players.length > 60 && (
                  <input className="dash-input mb-2" placeholder={`Rechercher parmi ${players.length}…`}
                    value={search} onChange={(e) => setSearch(e.target.value)} />
                )}
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-72 overflow-y-auto pr-1">
                  {shownPlayers.map((p, i) => (
                    <div key={p.pid} className={'glass rounded-xl px-3 py-2.5 flex items-center gap-2 group' + (i < 24 ? ' scale-in' : '')} style={i < 24 ? { animationDelay: (i % 12) * 0.03 + 's' } : undefined}>
                      <span>{p.emoji}</span>
                      <span className="text-sm font-medium truncate flex-1">{p.pseudo}</span>
                      <button onClick={() => onKick(p)} title="Exclure" className="opacity-0 group-hover:opacity-100 text-rose-400 hover:text-rose-300 text-xs transition">✕</button>
                    </div>
                  ))}
                </div>
                {hiddenCount > 0 && (
                  <p className="text-xs mt-2 text-center" style={{ color: 'var(--text-dim)' }}>
                    + {hiddenCount} autre{hiddenCount > 1 ? 's' : ''} participant{hiddenCount > 1 ? 's' : ''} (recherchez pour afficher)
                  </p>
                )}
              </div>
            )}
            {noQuestions ? (
              <div className="mt-6 glass rounded-2xl p-4 text-center">
                <p className="text-sm mb-3" style={{ color: 'var(--text-dim)' }}>
                  Aucune question dans ce quiz — ajoutez-en dans le dashboard avant de lancer.
                </p>
                <button onClick={() => { location.hash = '#/admin'; }}
                  className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 font-bold text-sm text-white shadow-lg shadow-emerald-500/25 transition-all active:scale-[0.98]">
                  🎛️ Ouvrir le dashboard
                </button>
              </div>
            ) : (
              <button onClick={onStart}
                className="mt-6 w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 font-bold text-lg text-white shadow-lg shadow-emerald-500/25 transition-all active:scale-[0.99]">
                ▶ Lancer la question 1
              </button>
            )}
          </div>
        </div>

        <div className="fixed bottom-0 left-0 right-0 bg-black/50 backdrop-blur border-t border-white/10 py-2 overflow-hidden z-20">
          <div className="marquee-track text-sm" style={{ color: 'var(--text-dim)' }}>
            {[0, 1].map((k) => (
              <span key={k} className="pr-12">
                🧠 MELTIN QUIZ — rejoignez avec le code <span className="text-cyan-300 font-mono font-bold">{room}</span>
                &nbsp;•&nbsp; 📱 Scannez le QR code &nbsp;•&nbsp; ⚡ Résultats en temps réel &nbsp;•&nbsp;
              </span>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function HostQuestion({ q, qIndex, total, answerCount, playerCount }) {
    const badge = U().typeBadge(q);
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 py-10 fade-in-up">              <div className="flex items-center gap-4 mb-4 flex-wrap justify-center">
          <span className="glass rounded-full px-4 py-1.5 text-sm font-mono text-cyan-300">Question {qIndex + 1} / {total}</span>
          <span className="glass rounded-full px-4 py-1.5 text-sm flex items-center gap-2 max-w-full">
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
            <span className="truncate">{answerCount} réponse{answerCount > 1 ? 's' : ''} · {playerCount} joueur{playerCount > 1 ? 's' : ''}</span>
          </span>
        </div>
        <div className="mb-8 text-sm bg-violet-500/10 border border-violet-400/30 text-violet-300 rounded-full px-4 py-1.5 font-semibold">
          {badge.icon} {badge.label}{q.unit ? ' · unité : ' + q.unit : ''}
        </div>
        <h1 className="host-title font-display font-black text-center max-w-5xl leading-tight">{q.question}</h1>

        {q.type === 'mcq' && q.options && (
          <div className="mt-8 sm:mt-10 grid gap-2.5 sm:gap-3 max-w-2xl w-full">
            {q.options.map((opt, i) => (
              <div key={i} className="glass px-4 py-3.5 sm:py-4 flex items-center gap-3 sm:gap-4 min-w-0">
                <span className="w-9 h-9 sm:w-11 sm:h-11 rounded-lg flex items-center justify-center font-display font-black shrink-0 text-white"
                  style={{ background: window.IB_CONFIG.OPT_GRADIENT[i], boxShadow: '0 4px 14px ' + window.IB_CONFIG.OPT_COLOR[i] + '44' }}>{OPT_LABEL()[i]}</span>
                <span className="font-semibold text-base sm:text-lg min-w-0 break-words text-left">{opt}</span>
              </div>
            ))}
          </div>
        )}
        {(q.type === 'word' || q.type === 'number' || q.type === 'scale') && (
          <div className="mt-10 text-lg flex items-center gap-3" style={{ color: 'var(--text-dim)' }}>
            <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
            {q.type === 'word' ? 'Les réponses libres arrivent — nuage en direct à la clôture'
              : q.type === 'number' ? 'Estimation en cours — qui sera le plus proche ?'
              : 'Échelle de ' + (q.min != null ? q.min : 1) + ' à ' + (q.max != null ? q.max : 10) + ' — les participants glissent le curseur'}
          </div>
        )}
      </div>
    );
  }

  function HostResults({ qIndex, total, q, results, playerCount, nameOf }) {
    const [mounted, setMounted] = useState(false);
    useEffect(() => { const t = setTimeout(() => setMounted(true), 120); return () => clearTimeout(t); }, [qIndex]);
    const badge = U().typeBadge(q);
    return (
      <div className="min-h-screen flex flex-col px-6 py-8 max-w-5xl mx-auto w-full fade-in-up">
        {/* En-tête centré : libère les coins (bouton ⛶, hint projection) */}
        <div className="flex flex-col items-center gap-2 mb-6">
          <div className="flex items-center gap-2 flex-wrap justify-center">
            <span className="glass rounded-full px-4 py-1.5 text-sm font-mono text-violet-300">Résultats — Q{qIndex + 1}/{total}</span>
            <span className="text-sm bg-violet-500/10 border border-violet-400/30 text-violet-300 rounded-full px-3 py-1">{badge.icon} {badge.label}</span>
          </div>
          <span className="text-sm" style={{ color: 'var(--text-dim)' }}>{results ? results.total : 0} réponse(s) · {playerCount} joueur(s)</span>
        </div>
        <h1 className="host-title-xl font-display font-black text-center mb-10 leading-tight">{q.question}</h1>
        <div className="glass p-6 sm:p-10 flex-1">
          <ResultBody q={q} r={results} mounted={mounted} nameOf={nameOf} />
        </div>
      </div>
    );
  }

  function HostPodium({ podium, playerCount, room }) {
    const order = [1, 0, 2];
    const heights = ['h-28', 'h-40', 'h-24'];
    const cols = podium || [];
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 py-10 fade-in-up">
        <div className="text-7xl mb-2">🏆</div>
        <h1 className="font-display text-4xl sm:text-5xl font-black bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 bg-clip-text text-transparent mb-10">Podium final</h1>
        <div className="flex items-end gap-4 sm:gap-8 mb-10">
          {order.map((idx, pos) => {
            const p = cols[idx];
            if (!p) return null;
            return (
              <div key={idx} className="podium-col flex flex-col items-center scale-in" style={{ animationDelay: pos * 0.15 + 's' }}>
                <div className="text-4xl mb-2">{p.emoji}</div>
                <div className="font-bold text-lg mb-1 max-w-[9rem] truncate text-center">{p.pseudo}</div>
                <div className="font-mono text-cyan-300 text-sm mb-3">{p.score} pts</div>
                <div className={'w-full rounded-t-2xl flex items-start justify-center pt-3 text-3xl ' + heights[pos]}
                  style={{ background: ['linear-gradient(180deg,#fbbf24,#b45309)', 'linear-gradient(180deg,#e2e8f0,#64748b)', 'linear-gradient(180deg,#fb923c,#9a3412)'][idx] }}>
                  {['🥇','🥈','🥉'][idx]}
                </div>
              </div>
            );
          })}
        </div>
        {playerCount > 3 && (
          <div className="glass px-6 py-3 text-sm" style={{ color: 'var(--text-dim)' }}>
            + {playerCount - 3} autre{playerCount - 3 > 1 ? 's' : ''} participant{playerCount - 3 > 1 ? 's' : ''} — bravo à tous ! 👏
          </div>
        )}
        <div className="mt-8 text-xs" style={{ color: 'var(--text-dim)' }}>Salle <span className="font-mono">{room}</span> — session terminée</div>
      </div>
    );
  }

  function HostControls({ phase, onClose, onNext, onRestart, onExit, isLast, answersCount }) {
    const { hidden: projDim } = React.useContext(ProjCtx);
    const btn = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all active:scale-95 flex items-center gap-2';
    return (
      <div className={'host-controls fixed bottom-5 left-1/2 -translate-x-1/2 z-40 fade-in-up' + (projDim ? ' proj-hidden' : '')}>
        <div className="ctrl-bar glass-strong px-4 py-3 flex items-center gap-2.5 flex-wrap justify-center">
          {phase === 'question' && (
            <React.Fragment>
              <span className="text-sm px-2 hidden sm:block" style={{ color: 'var(--text-dim)' }}>Votes ouverts · {answersCount} reçu{answersCount > 1 ? 's' : ''}</span>
              <button onClick={onClose} className={btn + ' bg-gradient-to-r from-rose-500 to-red-600 text-white shadow-lg shadow-rose-500/30 hover:from-rose-400'}>🔒 Clôturer les votes</button>
            </React.Fragment>
          )}
          {phase === 'results' && (
            <button onClick={onNext} className={btn + ' bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-lg shadow-emerald-500/30 hover:from-emerald-400'}>
              {isLast ? '🏆 Voir le podium' : '▶ Question suivante'}
            </button>
          )}
          {phase === 'podium' && (
            <button onClick={onRestart} className={btn + ' bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/30 hover:from-cyan-400'}>🔄 Nouvelle partie</button>
          )}
          {phase !== 'podium' && <button onClick={onRestart} title="Recommencer la session" className={btn + ' glass hover:bg-white/10'}>🔄</button>}
          <button onClick={onExit} title="Quitter" className={btn + ' glass hover:bg-white/10'}>✕</button>
        </div>
      </div>
    );
  }

  /* Big Quiz : anneau de compte à rebours (animateur). Le rendu est
       local (1 Hz + sous-seconde en fin de course), jamais écrit en base. */
  function TimerRing({ endsAt, seconds }) {
    const [, force] = useState(0);
    useEffect(() => {
      if (!endsAt) return undefined;
      let raf = 0, lastSec = -1;
      const loop = () => {
        const left = endsAt - Date.now();
        const s = Math.ceil(left / 1000);
        if (s !== lastSec) {
          lastSec = s;
          if (s > 0 && s <= 5) window.IB.audio.tick(s <= 2);
        }
        force((n) => n + 1);
        raf = requestAnimationFrame(left > 0 ? loop : () => {});
      };
      raf = requestAnimationFrame(loop);
      return () => cancelAnimationFrame(raf);
    }, [endsAt]);
    if (!endsAt) return null;
    const totalMs = (seconds > 0 ? seconds : 30) * 1000;
    const left = Math.max(0, endsAt - Date.now());
    const secs = Math.ceil(left / 1000);
    const urgent = secs <= 5;
    const C = 2 * Math.PI * 54;
    return (
      <div className={'fixed top-5 right-5 z-30 ' + (urgent ? 'timer-urgent' : '')}>
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="rgba(2,6,23,.55)" stroke="rgba(255,255,255,.08)" strokeWidth="8" />
          <circle cx="60" cy="60" r="54" fill="none"
            stroke={urgent ? '#f43f5e' : 'var(--accent, #22d3ee)'} strokeWidth="8" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C * (1 - Math.min(1, left / totalMs))}
            transform="rotate(-90 60 60)" style={{ transition: 'stroke-dashoffset .3s linear, stroke .3s' }} />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span className={'font-display font-black text-3xl leading-none ' + (urgent ? 'text-rose-400' : 'text-cyan-300')}>{secs}</span>
          <span className="text-[10px] uppercase tracking-widest" style={{ color: 'var(--text-dim)' }}>sec</span>
        </div>
      </div>
    );
  }

  /* ──────────────────────────────────────────────────────────────
     MODE PROJECTION — plein écran + masquage auto des contrôles.
     - requestProjection() : Fullscreen API + verrou paysage (mobiles)
     - idle : 4 s sans souris/toucher/clavier → la barre s'estompe
       (opacity-0 pointer-events-none), une pastille discrète signale
       que les contrôles sont cachés ; un mouvement les ramène.
     - « F » bascule le plein écran au clavier.
  ─────────────────────────────────────────────────────────────────── */
  function Projection({ children, enabled }) {
    const [fs, setFs] = useState(false);
    const [hidden, setHidden] = useState(false);
    const [inviteOff, setInviteOff] = useState(() => {
      try { return sessionStorage.getItem('ib_proj_invite') === 'off'; } catch (e) { return false; }
    });
    const timer = useRef(null);

    useEffect(() => {
      const onFsChange = () => setFs(!!document.fullscreenElement);
      document.addEventListener('fullscreenchange', onFsChange);
      return () => document.removeEventListener('fullscreenchange', onFsChange);
    }, []);

    /* Auto-masquage : armé après chaque interaction, uniquement en
       question/résultats/podium (jamais sur le lobby). */
    useEffect(() => {
      if (!enabled) { setHidden(false); clearTimeout(timer.current); return; }
      const wake = () => {
        setHidden(false);
        clearTimeout(timer.current);
        timer.current = setTimeout(() => setHidden(true), 4000);
      };
      wake();
      const evts = ['mousemove', 'mousedown', 'touchstart', 'keydown'];
      evts.forEach((e) => window.addEventListener(e, wake, { passive: true }));
      return () => {
        clearTimeout(timer.current);
        evts.forEach((e) => window.removeEventListener(e, wake));
      };
    }, [enabled]);

    /* « F » = toggle plein écran */
    useEffect(() => {
      const onKey = (e) => {
        if (enabled && (e.key === 'f' || e.key === 'F') && !e.target.matches('input, textarea, select')) {
          toggleFs();
        }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [enabled]);

    const toggleFs = () => {
      const el = document.documentElement;
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (!req) return;
          const p = req.call(el);
          if (p && p.then) p.then(() => {
            try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
          }).catch(() => {});
        }
      } catch (e) {}
    };

    const dismissInvite = () => {
      setInviteOff(true);
      try { sessionStorage.setItem('ib_proj_invite', 'off'); } catch (e) {}
    };

    return (
      <ProjCtx.Provider value={{ hidden }}>
        {children}
        {enabled && (
          <React.Fragment>
            {/* Invite plein écran : les navigateurs exigent un geste
                utilisateur — on la propose en un clic, puis plus jamais
                (masquée en inactivité, rejetable pour la session). */}
            {!hidden && !fs && !inviteOff && (
              <div className="proj-invite fixed bottom-24 left-1/2 -translate-x-1/2 z-40 fade-in-up">
                <div className="glass-strong rounded-full pl-5 pr-2 py-2 flex items-center gap-3">
                  <span className="text-sm text-slate-300">🎥 Mode projection</span>
                  <button onClick={toggleFs}
                    className="px-4 py-1.5 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-sm font-bold hover:from-cyan-400 transition-all active:scale-95">
                    ⛶ Plein écran
                  </button>
                  <button onClick={dismissInvite} title="Ne plus afficher"
                    className="w-7 h-7 rounded-full glass text-slate-400 hover:text-slate-200 text-xs transition">✕</button>
                </div>
              </div>
            )}
            <button onClick={toggleFs} title={fs ? 'Quitter le plein écran (F)' : 'Plein écran (F)'}
              className="proj-fs-btn fixed top-4 right-4 z-40 glass rounded-xl w-10 h-10 flex items-center justify-center text-lg hover:bg-white/10 transition">
              {fs ? '🗗' : '⛶'}
            </button>
            {hidden && (
              <div className="proj-hint fixed bottom-6 left-1/2 -translate-x-1/2 z-40 fade-in" title="Bougez la souris pour afficher les contrôles">
                <span className="glass rounded-full px-3 py-1.5 text-xs text-slate-400 flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-cyan-400/60 animate-pulse"></span>
                  Contrôles masqués
                </span>
              </div>
            )}
          </React.Fragment>
        )}
      </ProjCtx.Provider>
    );
  }

  /* Orchestration du flux animateur */
  function HostFlow({ room, showToast, onExit }) {
    const [state, setState] = useState({ status: 'waiting', questionIndex: -1, quiz: U().loadQuiz(), lastResults: null, podium: null });
    const [players, setPlayers] = useState([]);
    const [answersMap, setAnswersMap] = useState({});

    useEffect(() => {
      return window.IB.sync.host(room, {
        onState: setState,
        onPlayers: setPlayers,
        onAnswers: setAnswersMap,
        onError: (msg) => showToast(msg, 'error'),
      });
    }, [room]);

    /* Applique le thème de la salle dès qu'il change */
    useEffect(() => { window.IB.theme.applyTheme(state && state.theme); }, [state && state.theme]);

    const quiz = (state && state.quiz) || U().loadQuiz();
    const qIndex = state ? state.questionIndex : -1;
    const status = state ? state.status : 'waiting';

    /* Big Quiz : l'échéance du timer vit dans le doc de salle
       (questionEndsAt). Les participants l'affichent en local — aucune
       écriture supplémentaire côté Firebase. 0/null = pas de timer. */
    const timerFor = (q) => (q && q.seconds > 0 ? q.seconds * 1000 : 0);
    const startQuestion = async (idx) => {
      const secs = timerFor(quiz[idx]);
      const patch = { status: 'question', questionIndex: idx, lastResults: null };
      patch.questionEndsAt = secs ? Date.now() + secs : null;
      window.IB.sync.patchState(room, patch);
      if (secs) window.IB.audio.questionStart();
      await window.IB.sync.clearAnswers(room);
    };
    /* Auto-clôture à l'échéance : ref compteur, un seul déclenchement.
       La clôture n'attribue les points qu'aux réponses ARRIVÉES. */
    const closedRef = useRef(-1);
    useEffect(() => {
      if (status !== 'question' || !state.questionEndsAt) return;
      const endsAt = state.questionEndsAt;
      if (closedRef.current === qIndex) return;
      const iv = setInterval(() => {
        if (Date.now() >= endsAt && closedRef.current !== qIndex) {
          closedRef.current = qIndex;
          window.IB.audio.timeUp();
          closeVotes();
        }
      }, 250);
      return () => clearInterval(iv);
    }, [status, qIndex, state && state.questionEndsAt]);
    const closeVotes = async () => {
      if (closedRef.current === -1) closedRef.current = qIndex;  // clôture manuelle : pas d'auto-double
      const q = quiz[qIndex];
      const results = R().computeResults(q, answersMap, qIndex);
      window.IB.sync.patchState(room, { status: 'results', lastResults: results, questionEndsAt: null });
      const winners = R().computeWinners(q, answersMap, qIndex);
      winners.forEach((pid) => window.IB.sync.setScore(room, pid, 1));
      window.IB.audio.reveal();
    };
    const nextQuestion = () => { closedRef.current = -1; qIndex + 1 < quiz.length ? startQuestion(qIndex + 1) : finishQuiz(); };
    const finishQuiz = async () => {
      closedRef.current = -1;
      const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
      const podium = sorted.slice(0, 3).map((p) => ({ pid: p.pid, pseudo: p.pseudo, emoji: p.emoji, score: p.score || 0 }));
      window.IB.sync.patchState(room, { status: 'podium', podium, questionIndex: -1 });
      window.IB.audio.fanfare();
    };
    const restart = async () => {
      closedRef.current = -1;   // ré-arme l'auto-clôture pour la prochaine session
      await window.IB.sync.resetScores(room);
      await window.IB.sync.clearAnswers(room);
      window.IB.sync.patchState(room, { status: 'waiting', questionIndex: -1, lastResults: null, podium: null, questionEndsAt: null });
    };
    const kickPlayer = (p) => window.IB.sync.kick(room, p.pid);

    const currentQ = qIndex >= 0 && qIndex < quiz.length ? quiz[qIndex] : null;
    const answerCount = R().countAnswers(answersMap, qIndex);
    const nameOf = (pid) => { const p = players.find((x) => x.pid === pid); return p ? p.pseudo : null; };

    /* Mode projection actif dès qu'une question tourne (question,
       résultats, podium) — jamais sur le lobby (QR doit rester visible). */
    const proj = status !== 'waiting';

    if (status === 'podium') {
      return (
        <Projection enabled={proj}>
          <HostPodium podium={state.podium || []} playerCount={players.length} room={room} />
          <HostControls phase="podium" onRestart={restart} onExit={onExit} />
        </Projection>
      );
    }
    if (status === 'question' && currentQ) {
      return (
        <Projection enabled={proj}>
          <HostQuestion q={currentQ} qIndex={qIndex} total={quiz.length} answerCount={answerCount} playerCount={players.length} />
          <TimerRing endsAt={state.questionEndsAt} seconds={currentQ.seconds} />
          <HostControls phase="question" answersCount={answerCount} onClose={closeVotes} onRestart={restart} onExit={onExit} />
        </Projection>
      );
    }
    if (status === 'results' && currentQ) {
      const isLast = qIndex + 1 >= quiz.length;
      return (
        <Projection enabled={proj}>
          <HostResults qIndex={qIndex} total={quiz.length} q={currentQ} results={state.lastResults} playerCount={players.length} nameOf={nameOf} />
          <HostControls phase="results" isLast={isLast} onNext={nextQuestion} onRestart={restart} onExit={onExit} answersCount={answerCount} />
        </Projection>
      );
    }
    return (
      <HostLobby room={room} joinUrl={U().joinUrlFor(room)} players={players}
        onKick={kickPlayer} onStart={() => startQuestion(0)} onExit={onExit} quizTitle={state && state.quizTitle} questionCount={quiz.length} />
    );
  }

  window.IB.views = window.IB.views || {};
  window.IB.views.HostFlow = HostFlow;
})();

</script>
<script type="text/babel" data-presets="react">
/* ════════════════════════════════════════════════════════════════
   VIEW — Dashboard (#/admin)
   Créer / modifier les questions, changer le style, personnaliser
   les options. Persisté en localStorage ; les salles déjà créées
   gardent leur copie (diffusée à l'exécution).
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  const U = () => window.IB.util;

  /* ── Verrou PIN ─────────────────────────────────────────────
     SHA-256 du PIN (jamais en clair côté JS expose) ; la config
     contient IB_CONFIG.ADMIN_PIN. Session mémorisée 8 h.        */
  async function sha256(txt) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  const UNLOCK_HOURS = 8;

  function PinGate({ onUnlock }) {
    const [pin, setPin] = useState('');
    const pinRef = useRef('');                 // source de vérité pour le submit async
    const [error, setError] = useState(false);
    const [hashOk, setHashOk] = useState(false);
    const expectedRef = useRef(null);

    useEffect(() => {
      sha256(String(window.IB_CONFIG.ADMIN_PIN)).then((h) => { expectedRef.current = h; setHashOk(true); });
    }, []);

    const submit = async () => {
      const h = await sha256(pinRef.current);
      if (expectedRef.current && h === expectedRef.current) {
        U().store.set('admin_unlocked_until', Date.now() + UNLOCK_HOURS * 3600 * 1000);
        onUnlock();
      } else {
        setError(true);
        pinRef.current = '';
        setPin('');
        setTimeout(() => setError(false), 600);
      }
    };

    const digit = (d) => {
      if (pinRef.current.length >= 4) return;
      const next = pinRef.current + d;
      pinRef.current = next;
      setPin(next);
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
      if (next.length === 4) setTimeout(submit, 120);
    };

    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4">
        <div className={'glass-strong p-8 w-full max-w-xs text-center fade-in-up' + (error ? ' shake' : '')}>
          <div className="text-5xl mb-3 select-none">🔐</div>
          <h2 className="font-display text-2xl font-bold mb-1">Dashboard</h2>
          <p className="text-sm mb-6" style={{ color: 'var(--text-dim)' }}>Saisissez le code à 4 chiffres</p>
          <div className="flex justify-center gap-3 mb-6" aria-label="PIN saisi">
            {[0, 1, 2, 3].map((i) => (
              <div key={i}
                className={'w-12 h-14 rounded-xl border-2 flex items-center justify-center font-display text-2xl font-black transition-all ' +
                  (error ? 'border-rose-400/70 text-rose-300' : pin.length > i ? 'border-cyan-400/70 text-cyan-300 bg-cyan-400/10' : 'border-white/15 text-transparent')}>
                {pin.length > i ? '•' : '·'}
              </div>
            ))}
          </div>
          <div className="grid grid-cols-3 gap-2.5">
            {['1','2','3','4','5','6','7','8','9'].map((d) => (
              <button key={d} onClick={() => digit(d)} className="glass py-3.5 font-display text-xl font-bold hover:bg-white/10 transition active:scale-95">{d}</button>
            ))}
            <button onClick={() => { pinRef.current = ''; setPin(''); }} className="glass py-3.5 text-sm hover:bg-white/10 transition active:scale-95" style={{ color: 'var(--text-dim)' }}>C</button>
            <button onClick={() => digit('0')} className="glass py-3.5 font-display text-xl font-bold hover:bg-white/10 transition active:scale-95">0</button>
            <button onClick={() => { pinRef.current = pinRef.current.slice(0, -1); setPin(pinRef.current); }} className="glass py-3.5 text-xl hover:bg-white/10 transition active:scale-95" style={{ color: 'var(--text-dim)' }}>⌫</button>
          </div>
          {error && <p className="text-rose-300 text-sm mt-4 fade-in-up">Code incorrect</p>}
          {!hashOk && <p className="text-xs mt-4" style={{ color: 'var(--text-dim)' }}>Initialisation…</p>}
          <a href="#/" className="block mt-6 text-xs hover:text-slate-300 transition" style={{ color: 'var(--text-dim)' }}>← Retour à l'accueil</a>
        </div>
      </div>
    );
  }

  const newQuestion = (type) => {
    const base = { phase: '', type, question: '', seconds: 30 };
    if (type === 'mcq') return { ...base, options: ['Option 1', 'Option 2', '', ''] };
    if (type === 'word') return { ...base, placeholder: 'Votre réponse…', maxLen: 30 };
    if (type === 'number') return { ...base, unit: '', maxLen: 12, target: '' };
    if (type === 'scale') return { ...base, min: 1, max: 10 };
    return base;
  };

  function QuestionEditor({ q, index, onChange, onDelete, onMove }) {
    const badge = U().typeBadge(q);
    return (
      <div className="dash-card fade-in-up">
        <div className="flex items-center gap-2 mb-3">
          <span className="font-mono text-xs bg-white/5 rounded-lg px-2.5 py-1" style={{ color: 'var(--text-dim)' }}>Q{index + 1}</span>
          <span className="text-xs bg-violet-500/10 border border-violet-400/30 text-violet-300 rounded-full px-2.5 py-1">{badge.icon} {badge.label}</span>
          <div className="flex-1" />
          <button onClick={() => onMove(index, -1)} title="Monter" className="btn-ghost px-2.5 py-1 text-xs">↑</button>
          <button onClick={() => onMove(index, 1)} title="Descendre" className="btn-ghost px-2.5 py-1 text-xs">↓</button>
          <button onClick={onDelete} title="Supprimer" className="btn-ghost btn-danger px-2.5 py-1 text-xs">✕</button>
        </div>

        <label className="dash-label">Phase</label>
        <input className="dash-input mb-3" value={q.phase || ''}
          onChange={(e) => onChange({ ...q, phase: e.target.value })} placeholder="Ex : Phase 1 — Le Réveil" list="ib-phases" />

        <div className="grid sm:grid-cols-[1fr_auto] gap-3 mb-3">
          <div>
            <label className="dash-label">⏱ Durée (Big Quiz — 0 = pas de timer)</label>
            <div className="flex items-center gap-2">
              <input className="dash-input" type="number" min="0" max="300" value={q.seconds != null ? q.seconds : 0}
                onChange={(e) => onChange({ ...q, seconds: Math.max(0, Math.min(300, Number(e.target.value) || 0)) })} />
              <span className="text-xs shrink-0" style={{ color: 'var(--text-dim)' }}>secondes</span>
            </div>
          </div>
        </div>

        <div className="grid sm:grid-cols-[1fr_auto] gap-3 mb-3">
          <div>
            <label className="dash-label">Question</label>
            <textarea className="dash-textarea" rows="2" value={q.question}
              onChange={(e) => onChange({ ...q, question: e.target.value })} placeholder="Votre question…" />
          </div>
          <div className="sm:w-40">
            <label className="dash-label">Format</label>
            <select className="dash-select" value={q.type}
              onChange={(e) => onChange({ ...newQuestion(e.target.value), phase: q.phase, question: q.question })}>
              <option value="mcq">🔘 Choix multiple</option>
              <option value="word">☁️ Nuage de mots</option>
              <option value="number">🔢 Estimation</option>
              <option value="scale">📏 Échelle</option>
            </select>
          </div>
        </div>

        {q.type === 'mcq' && (
          <div className="grid sm:grid-cols-2 gap-2 mb-3">
            {q.options.map((opt, i) => (
              <div key={i} className="flex items-center gap-1.5 min-w-0">
                <span className="w-8 h-8 rounded-lg flex items-center justify-center font-display font-black text-sm shrink-0 text-white"
                  style={{ background: window.IB_CONFIG.OPT_GRADIENT[i] }}>{window.IB_CONFIG.OPT_LABEL[i]}</span>
                <input className="dash-input min-w-0 flex-1" value={opt}
                  onChange={(e) => { const options = [...q.options]; options[i] = e.target.value; onChange({ ...q, options }); }} />
                <button title="Bonne réponse" onClick={() => onChange({ ...q, correctIndex: q.correctIndex === i ? undefined : i })}
                  className={'shrink-0 text-lg ' + (q.correctIndex === i ? '' : 'opacity-30 hover:opacity-70 transition')}>
                  {q.correctIndex === i ? '✅' : '⬜'}
                </button>
              </div>
            ))}
          </div>
        )}

        {q.type === 'word' && (
          <div className="grid sm:grid-cols-2 gap-3">
            <div>
              <label className="dash-label">Placeholder</label>
              <input className="dash-input" value={q.placeholder || ''}
                onChange={(e) => onChange({ ...q, placeholder: e.target.value })} />
            </div>
            <div>
              <label className="dash-label">Longueur max</label>
              <input className="dash-input" type="number" min="4" max="80" value={q.maxLen || 30}
                onChange={(e) => onChange({ ...q, maxLen: Number(e.target.value) })} />
            </div>
          </div>
        )}

        {q.type === 'number' && (
          <div className="grid sm:grid-cols-3 gap-3">
            <div>
              <label className="dash-label">Unité</label>
              <input className="dash-input" value={q.unit || ''} onChange={(e) => onChange({ ...q, unit: e.target.value })} placeholder="M€, jours, %…" />
            </div>
            <div>
              <label className="dash-label">Cible (le + proche gagne)</label>
              <input className="dash-input" type="number" value={q.target != null && q.target !== '' ? q.target : ''}
                onChange={(e) => onChange({ ...q, target: e.target.value === '' ? '' : Number(e.target.value) })} placeholder="optionnel" />
            </div>
            <div>
              <label className="dash-label">Longueur max</label>
              <input className="dash-input" type="number" min="3" max="15" value={q.maxLen || 12}
                onChange={(e) => onChange({ ...q, maxLen: Number(e.target.value) })} />
            </div>
          </div>
        )}

        {q.type === 'scale' && (
          <div className="grid sm:grid-cols-2 gap-3">
            <div>
              <label className="dash-label">Minimum</label>
              <input className="dash-input" type="number" value={q.min != null ? q.min : 1}
                onChange={(e) => onChange({ ...q, min: Number(e.target.value) })} />
            </div>
            <div>
              <label className="dash-label">Maximum</label>
              <input className="dash-input" type="number" value={q.max != null ? q.max : 10}
                onChange={(e) => onChange({ ...q, max: Number(e.target.value) })} />
            </div>
          </div>
        )}
      </div>
    );
  }

  /* Interrupteur sons (persistant, partagé animateur/participants) */
  function SoundToggle() {
    const [on, setOn] = useState(window.IB.audio.enabled());
    return (
      <button onClick={() => { const v = !on; window.IB.audio.setEnabled(v); setOn(v); }}
        className={'shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition ' + (on ? 'bg-emerald-500/20 border border-emerald-400/40 text-emerald-300' : 'glass text-slate-400')}
        title={on ? 'Couper les sons' : 'Activer les sons'}>
        {on ? '🔊 Activés' : '🔇 Coupés'}
      </button>
    );
  }

  function StyleEditor({ theme, onChange }) {
    const presets = window.IB_CONFIG.THEME_PRESETS;
    const fonts = window.IB.theme.FONT_CHOICES;
    const vars = theme.vars || {};
    const setVar = (k, v) => onChange({ ...theme, vars: { ...vars, [k]: v } });
    const ROWS = [
      ['--bg', 'Fond principal'], ['--bg-2', 'Fond des cartes'], ['--bg-3', 'Fond surélevé'],
      ['--accent', 'Accent principal'], ['--accent-2', 'Accent secondaire'], ['--accent-3', 'Accent tertiaire'],
      ['--text', 'Texte'], ['--text-dim', 'Texte secondaire'],
    ];
    return (
      <div className="space-y-4">
        <div>
          <label className="dash-label">Preset</label>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            {Object.entries(presets).map(([key, p]) => (
              <button key={key} onClick={() => onChange({ preset: key, vars: {} })}
                className={'dash-card text-left text-sm font-semibold transition ' + (theme.preset === key || (!theme.preset && key === 'navy') ? 'ring-2 ring-cyan-400/60' : 'hover:border-white/20')}>
                {p.label}
                <div className="flex gap-1 mt-2">
                  {['--accent', '--accent-2', '--accent-3'].map((k) => (
                    <span key={k} className="w-4 h-4 rounded-full" style={{ background: p.vars[k] }} />
                  ))}
                </div>
              </button>
            ))}
          </div>
        </div>
        <div className="grid sm:grid-cols-2 gap-3">
          {ROWS.map(([k, label]) => (
            <div key={k} className="flex items-center gap-3">
              <input type="color" value={vars[k] || presets[theme.preset || 'navy'].vars[k]}
                onChange={(e) => setVar(k, e.target.value)}
                className="w-9 h-9 rounded-lg cursor-pointer bg-transparent border border-white/15 shrink-0" />
              <div className="flex-1">
                <label className="dash-label mb-0">{label}</label>
                <code className="text-[11px]" style={{ color: 'var(--text-dim)' }}>{k}</code>
              </div>
            </div>
          ))}
        </div>
        <div className="grid sm:grid-cols-2 gap-3">
          <div>
            <label className="dash-label">Police des titres</label>
            <select className="dash-select" value={(vars['--font-display'] || presets[theme.preset || 'navy'].vars['--font-display']).split(',')[0].replace(/'/g, '')}
              onChange={(e) => { const f = e.target.value; window.IB.theme.loadDisplayFont(f); setVar('--font-display', "'" + f + "', sans-serif"); }}>
              {fonts.map((f) => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          <div>
            <label className="dash-label">Arrondi des cartes</label>
            <select className="dash-select" value={vars['--radius'] || presets[theme.preset || 'navy'].vars['--radius']}
              onChange={(e) => setVar('--radius', e.target.value)}>
              <option value="0.25rem">Carré (0.25rem)</option>
              <option value="0.5rem">Doux (0.5rem)</option>
              <option value="0.75rem">Moyen (0.75rem)</option>
              <option value="1.25rem">Arrondi (1.25rem)</option>
              <option value="1.75rem">Très arrondi (1.75rem)</option>
            </select>
          </div>
        </div>
      </div>
    );
  }

  function Dashboard({ onBack }) {
    const [unlocked, setUnlocked] = useState(() => {
      const until = U().store.get('admin_unlocked_until', 0);
      return Date.now() < until;
    });
    const [tab, setTab] = useState('quiz');                    // quiz | style | data
    const [quiz, setQuiz] = useState(U().loadQuiz());
    const [theme, setTheme] = useState(U().store.get('theme', { preset: 'navy', vars: {} }));
    const [savedFlash, setSavedFlash] = useState(false);
    const [saveState, setSaveState] = useState('');     // '' | 'saving…' | '✅ cloud' | '⚠️ local' | '✗'
    const [importText, setImportText] = useState('');
    const [importErr, setImportErr] = useState('');

    /* Live preview du style pendant l'édition */
    useEffect(() => { window.IB.theme.applyTheme(theme); }, [theme]);

    /* Au montage : la source officielle est le CLOUD (config/dashboard).
       On remplace l'état local si le cloud a une version — évite les
       divergences entre appareils/navigateurs/domaines. */
    useEffect(() => {
      if (!window.IB.sync.loadDashboard) return;      // mode démo : localStorage only
      let dead = false;
      window.IB.sync.loadDashboard().then((cfg) => {
        if (dead || !cfg) return;
        if (Array.isArray(cfg.quiz) && cfg.quiz.length) {
          setQuiz(cfg.quiz);
          U().saveQuiz(cfg.quiz);
        }
        if (cfg.theme) {
          setTheme(cfg.theme);
          window.IB.theme.applyTheme(cfg.theme);
          U().store.set('theme', cfg.theme);
        }
      });
      return () => { dead = true; };
    }, []);

    const phases = [...new Set(quiz.map((q) => q.phase).filter(Boolean))];

    const save = async (nextQuiz, nextTheme) => {
      const cleanQuiz = U().sanitizeQuiz(nextQuiz);
      U().saveQuiz(cleanQuiz);                        // cache local (repli + mode démo)
      U().store.set('theme', nextTheme);
      setQuiz(cleanQuiz);
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1500);
      /* Source officielle : le cloud (tous les appareils verront ceci) */
      if (window.IB.sync.saveDashboard) {
        setSaveState('saving…');
        const ok = await window.IB.sync.saveDashboard(cleanQuiz, nextTheme);
        setSaveState(ok ? '✅ cloud' : '⚠️ local seul');
        setTimeout(() => setSaveState(''), 2500);
      }
    };

    const updateQ = (i, nq) => setQuiz(quiz.map((x, j) => (j === i ? nq : x)));
    const deleteQ = (i) => setQuiz(quiz.filter((_, j) => j !== i));
    const moveQ = (i, dir) => {
      const j = i + dir;
      if (j < 0 || j >= quiz.length) return;
      const next = [...quiz];
      [next[i], next[j]] = [next[j], next[i]];
      setQuiz(next);
    };
    const addQ = (type) => setQuiz([...quiz, newQuestion(type)]);

    /* Tout effacer : confirmation, purge locale + cloud (le thème est
       conservé). Chaque organisateur part de zéro. */
    const clearAll = () => {
      if (quiz.length === 0) return;
      if (!window.confirm('Effacer les ' + quiz.length + ' question' + (quiz.length > 1 ? 's' : '') + ' ? Cette action est définitive (pensez à exporter avant).')) return;
      save([], theme);
    };

    const exportJson = () => {
      const blob = new Blob([JSON.stringify({ quiz, theme }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'icebreaker-quiz.json';
      a.click();
      URL.revokeObjectURL(a.href);
    };

    const importJson = () => {
      try {
        const data = JSON.parse(importText);
        if (!Array.isArray(data.quiz) && !Array.isArray(data)) throw new Error('Structure inattendue');
        const nextQuiz = U().sanitizeQuiz(Array.isArray(data) ? data : data.quiz);
        if (data.theme) { setTheme(data.theme); window.IB.theme.applyTheme(data.theme); U().store.set('theme', data.theme); }
        setQuiz(nextQuiz);
        U().saveQuiz(nextQuiz);
        setImportText(''); setImportErr('');
        setSavedFlash(true); setTimeout(() => setSavedFlash(false), 1500);
      } catch (e) { setImportErr('JSON invalide : ' + e.message); }
    };

    if (!unlocked) return <PinGate onUnlock={() => setUnlocked(true)} />;

    return (      <div className="min-h-screen px-4 py-8">
        <div className="max-w-4xl mx-auto">

          <div className="flex items-center gap-2 sm:gap-3 mb-4 fade-in-up flex-wrap">
            <button onClick={onBack} className="btn-ghost shrink-0">← Retour</button>
            <h1 className="font-display text-xl sm:text-2xl font-black flex-1 min-w-0 truncate">🎛️ Dashboard</h1>
            {savedFlash && <span className="text-emerald-300 text-sm font-semibold fade-in-up">✅</span>}
            {saveState && <span className={'text-xs font-semibold fade-in ' + (saveState.startsWith('✅') ? 'text-emerald-300' : saveState.startsWith('⚠️') ? 'text-amber-300' : 'text-slate-400')}>{saveState}</span>}
            <button onClick={() => { U().store.del('admin_unlocked_until'); location.hash = '#/'; }}
              title="Re-verrouiller le dashboard" className="btn-ghost shrink-0">🔒</button>
            <button onClick={() => save(quiz, theme)} className="btn-primary shrink-0">💾 Enregistrer</button>
          </div>

          <div className="flex gap-2 mb-6 fade-in-up flex-wrap">
            {[['quiz', '❓ Questions'], ['style', '🎨 Style'], ['data', '📦 Import / Export']].map(([key, label]) => (
              <button key={key} onClick={() => setTab(key)}
                className={'px-4 py-2 rounded-xl text-sm font-bold transition ' + (tab === key ? 'bg-white/12 text-white border border-white/25' : 'glass text-sm') }
                style={tab === key ? {} : { color: 'var(--text-dim)' }}>
                {label}
              </button>
            ))}
          </div>

          {tab === 'quiz' && (
            <div className="space-y-4">
              {quiz.length === 0 && (
                <div className="dash-card text-center py-10 fade-in-up">
                  <div className="text-5xl mb-3">📝</div>
                  <h3 className="font-display font-bold text-lg mb-1">Aucune question pour l'instant</h3>
                  <p className="text-sm mb-5" style={{ color: 'var(--text-dim)' }}>
                    Créez vos questions une par une, ou importez un JSON existant (onglet Import / Export).
                  </p>
                  <div className="flex gap-2 flex-wrap justify-center">
                    {[['mcq', '＋ QCM'], ['word', '＋ Nuage'], ['number', '＋ Estimation'], ['scale', '＋ Échelle']].map(([t, label]) => (
                      <button key={t} onClick={() => addQ(t)} className="btn-primary">{label}</button>
                    ))}
                  </div>
                </div>
              )}
              <div className="dash-card flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <h3 className="font-display font-bold text-sm">🔊 Sons & timer</h3>
                  <p className="text-xs mt-0.5" style={{ color: 'var(--text-dim)' }}>
                    Sons façon Kahoot + compte à rebours par question (champ « Durée »).
                  </p>
                </div>
                <SoundToggle />
              </div>
              <datalist id="ib-phases">{phases.map((p) => <option key={p} value={p} />)}</datalist>
              {quiz.map((q, i) => (
                <QuestionEditor key={i} q={q} index={i} onChange={(nq) => updateQ(i, nq)} onDelete={() => deleteQ(i)} onMove={moveQ} />
              ))}
              <div className="flex gap-2 flex-wrap pt-2">
                {[['mcq', '＋ QCM'], ['word', '＋ Nuage'], ['number', '＋ Estimation'], ['scale', '＋ Échelle']].map(([t, label]) => (
                  <button key={t} onClick={() => addQ(t)} className="btn-ghost">{label}</button>
                ))}
              </div>
              {quiz.length > 0 && (
                <div className="pt-2">
                  <button onClick={clearAll}
                    className="text-xs text-rose-300/70 hover:text-rose-300 underline underline-offset-2 transition">
                    🗑 Tout effacer ({quiz.length} question{quiz.length > 1 ? 's' : ''})
                  </button>
                </div>
              )}
            </div>
          )}

          {tab === 'style' && <StyleEditor theme={theme} onChange={setTheme} />}

          {tab === 'data' && (
            <div className="space-y-6">
              <div className="dash-card">
                <h3 className="font-display font-bold mb-2">Exporter</h3>
                <p className="text-sm mb-3" style={{ color: 'var(--text-dim)' }}>Sauvegarde vos {quiz.length} questions et votre thème dans un fichier JSON.</p>
                <button onClick={exportJson} className="btn-primary">⬇️ Télécharger le JSON</button>
              </div>
              <div className="dash-card">
                <h3 className="font-display font-bold mb-2">Importer</h3>
                <textarea className="dash-textarea font-mono text-xs" rows="5" value={importText}
                  onChange={(e) => setImportText(e.target.value)} placeholder='{"quiz": [...], "theme": {...}}' />
                {importErr && <p className="text-rose-300 text-sm mt-2">{importErr}</p>}
                <button onClick={importJson} disabled={!importText.trim()} className="btn-primary mt-3">⬆️ Importer</button>
                <button onClick={clearAll}
                  className="btn-ghost btn-danger ml-2">🗑 Tout effacer</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  window.IB.views = window.IB.views || {};
  window.IB.views.Dashboard = Dashboard;
})();

</script>
</head>

<body>
<div class="blob blob-cyan" aria-hidden="true"></div>
<div class="blob blob-violet" aria-hidden="true"></div>
<div class="blob blob-emerald" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>

<div id="root" class="relative z-10 min-h-screen"></div>

<!-- Vues + routeur : compilés par Babel (type="text/babel") -->
<script type="text/babel" data-presets="react">
/* ════════════════════════════════════════════════════════════════
   APP — Routeur par hash + montage
   #/        → accueil
   #/join    → participant (avec ?room=CODE)
   #/host    → animateur (avec ?room=CODE)
   #/admin   → dashboard questions & style
════════════════════════════════════════════════════════════════ */
'use strict';

(function () {
  const U = window.IB.util;

  function App() {
    const [route, setRoute] = useState(U.hash());          // home | join | host | admin
    const [room, setRoom] = useState(U.getRoomParam());
    const [toast, setToast] = useState(null);
    const toastTimer = useRef(null);

    const showToast = useCallback((msg, type) => {
      setToast({ msg, type: type || 'success' });
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(() => setToast(null), 2800);
    }, []);

    useEffect(() => {
      const onHash = () => setRoute(U.hash());
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    /* Lien QR scanné (?room=CODE sans #) : sauter l'accueil, aller
       directement à la saisie du pseudo. */
    useEffect(() => {
      if (U.getRoomParam() && !window.location.hash) location.hash = '#/join';
    }, []);

    const goJoin = (code) => { setRoom(code); U.setRoomParam(code); location.hash = '#/join'; };
    const goCreate = () => {
      const c = U.genRoomCode();
      setRoom(c); U.setRoomParam(c); location.hash = '#/host';
    };
    const goHome = () => { U.setRoomParam(''); setRoom(''); location.hash = '#/'; };
    const goAdmin = () => { location.hash = '#/admin'; };

    const views = window.IB.views;
    return (
      <React.Fragment>
        <Toast toast={toast} />
        <ErrorBoundary key={route + ':' + room}>
        {route === 'home' && <views.HomeScreen onJoin={goJoin} onCreate={goCreate} />}
        {route === 'join' && <views.ParticipantFlow room={room} showToast={showToast} onBack={goHome} />}
        {route === 'host' && <views.HostFlow room={room} showToast={showToast} onExit={goHome} />}
        {route === 'admin' && <views.Dashboard onBack={goHome} />}
        </ErrorBoundary>
      </React.Fragment>
    );
  }

  /* Thème au démarrage (avant premier rendu pour éviter le flash) */
  window.IB.theme.applyTheme(window.IB.util.store.get('theme', { preset: 'navy', vars: {} }));
  const dispFont = (window.IB.util.store.get('theme', {}).vars || {})['--font-display'];
  if (dispFont) window.IB.theme.loadDisplayFont(dispFont);

  /* Le bouton "Créer" doit exposer son code de salle : le router host lit ?room= */
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();

</script>

<!-- PWA : enregistrement du service worker -->
<script>
  if (false) { // SW désactivé dans le bundle de test
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
